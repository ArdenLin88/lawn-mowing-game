// 玩家
// ─────────────────────────────────────────
const player = {
  x: canvas.width / 2,
  y: canvas.height / 2,
  radius: 18,
  bladeRadius: 55,
  bladeArc: Math.PI * 0.55,   // ← V2 抽出為可修改屬性
  bladeAngle: 0,
  speed: 3.2,
  hp: 5,
  maxHp: 5,
  invincible: 0,
  bladeSpinAngle: 0,

  // V2 新增
  skillLevels: {},
  magnetRange: 80,
  ghostOrbLevel: 0,
  ghostOrbTimer: 0,
  areaBombRadius: 0,
  chainSlashLevel: 0,
  critChance: 0.15,  // P2：爆擊率（15% base）

  // V3 新增
  evolutions: {},
  soulScytheActive: false,
  hellfireActive: false,
  stormChainActive: false,

  // Phase 6：盜賊衝刺屬性
  dashActive: 0,       // 衝刺剩餘幀數
  dashCooldown: 0,     // 衝刺冷卻剩餘幀數
  dashVx: 0,           // 衝刺速度 X
  dashVy: 0,           // 衝刺速度 Y

  update() {
    let dx = 0, dy = 0;
    if (keys['w'] || keys['W'] || keys['ArrowUp'])    dy -= 1;
    if (keys['s'] || keys['S'] || keys['ArrowDown'])   dy += 1;
    if (keys['a'] || keys['A'] || keys['ArrowLeft'])   dx -= 1;
    if (keys['d'] || keys['D'] || keys['ArrowRight'])  dx += 1;

    // 搖桿輸入：鍵盤無輸入時生效（dead-zone 0.15）
    // Phase 6：衝刺中跳過普通移動
    if (currentCharacter === 'rogue' && this.dashActive > 0) {
      // 衝刺中，位移由衝刺系統接管（後面處理）
    } else if (dx === 0 && dy === 0 && joyMove.active) {
      const mag = Math.hypot(joyMove.x, joyMove.y);
      if (mag > 0.15) {
        this.x += joyMove.x * this.speed;
        this.y += joyMove.y * this.speed;
      }
    } else if (dx !== 0 || dy !== 0) {
      const len = Math.sqrt(dx * dx + dy * dy);
      this.x += (dx / len) * this.speed;
      this.y += (dy / len) * this.speed;
    }

    this.x = Math.max(this.radius + 2, Math.min(canvas.width  - this.radius - 2, this.x));
    this.y = Math.max(this.radius + 2, Math.min(canvas.height - this.radius - 2, this.y));

    // 瞄準：右搖桿啟用時用搖桿方向，否則用滑鼠座標
    if (joyAim.active && Math.hypot(joyAim.x, joyAim.y) > 0.15) {
      this.bladeAngle = Math.atan2(joyAim.y, joyAim.x);
    } else {
      this.bladeAngle = Math.atan2(mouseY - this.y, mouseX - this.x);
    }
    this.bladeSpinAngle += 0.18;

    if (this.invincible > 0) this.invincible--;

    // 法師魔法彈自動發射
    if (currentCharacter === 'mage') {
      mageFireTimer++;
      const interval = Math.max(20, 50 - (player.skillLevels['bolt_speed'] || 0) * 12);
      if (mageFireTimer >= interval) { mageFireTimer = 0; fireMagicBolt(); }
    }

    // Phase 6：盜賊衝刺 + 自動投擲匕首
    if (currentCharacter === 'rogue') {
      // 冷卻倒計時
      if (this.dashCooldown > 0) this.dashCooldown--;

      // 觸發衝刺（Shift 鍵 / 搖桿快推）
      const dashMaxCd = Math.max(90, 180 - (player.skillLevels['dodge'] || 0) * 30);
      const joyDash   = joyAim.active && Math.hypot(joyAim.x, joyAim.y) > 0.8;
      if ((keys['Shift'] || joyDash) && this.dashCooldown <= 0 && this.dashActive <= 0) {
        const len = Math.hypot(dx, dy);
        this.dashVx = len > 0 ? (dx / len) * 10 : Math.cos(this.bladeAngle) * 10;
        this.dashVy = len > 0 ? (dy / len) * 10 : Math.sin(this.bladeAngle) * 10;
        this.dashActive   = 14;   // 14 幀≈0.23s，位移合計≈140px
        this.dashCooldown = dashMaxCd;
        addParticles(this.x, this.y, COLORS.blood, 12);
      }

      // 衝刺位移（全程無敵）
      if (this.dashActive > 0) {
        this.dashActive--;
        this.x += this.dashVx;
        this.y += this.dashVy;
        this.x = Math.max(this.radius + 2, Math.min(canvas.width  - this.radius - 2, this.x));
        this.y = Math.max(this.radius + 2, Math.min(canvas.height - this.radius - 2, this.y));
        this.invincible = Math.max(this.invincible, 2);
      }

      // 自動投擲匕首（combo 越高投越快）
      rogueDaggerTimer++;
      const comboBonusInt  = Math.min(30, comboCount * 5);
      const daggerInterval = Math.max(25, 45 - comboBonusInt);
      if (rogueDaggerTimer >= daggerInterval) { rogueDaggerTimer = 0; fireDagger(); }
    }

    // 鬼火計時（只在 playing 狀態）
    if (this.ghostOrbLevel > 0) {
      this.ghostOrbTimer++;
      const interval = this.ghostOrbLevel >= 3 ? 60 : 120; // Lv3=1s, 其他=2s
      if (this.ghostOrbTimer >= interval) {
        this.ghostOrbTimer = 0;
        const orbCount = [1, 3, 5][Math.min(this.ghostOrbLevel - 1, 2)];
        for (let i = 0; i < orbCount; i++) fireGhostOrb();
      }
    }
  },

  drawNecromancer() {
    ctx.save();
    ctx.translate(this.x, this.y);
    // 鐮刀弧形光效
    const rot = this.bladeSpinAngle;
    const arc = this.bladeArc;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.arc(0, 0, this.bladeRadius, rot - arc/2, rot + arc/2);
    ctx.closePath();
    ctx.fillStyle = 'rgba(200,148,26,0.10)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(200,148,26,0.45)';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    // 黑袍身體
    ctx.rotate(rot);
    ctx.fillStyle = '#2A231C';
    ctx.strokeStyle = COLORS.muted; ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(0, -15); ctx.lineTo(-9, 12); ctx.lineTo(9, 12); ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.rotate(-rot);
    // 骷髏頭
    ctx.fillStyle = COLORS.enemy;
    ctx.strokeStyle = COLORS.bg; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(0, -20, 8, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    // 眼窩（血紅）
    ctx.fillStyle = this.invincible > 0 ? COLORS.warning : COLORS.blood;
    ctx.beginPath(); ctx.arc(-3, -22, 2, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(3, -22, 2, 0, Math.PI * 2); ctx.fill();
    // 受傷閃爍
    if (this.invincible > 0 && Math.floor(this.invincible / 6) % 2 === 0) {
      ctx.globalAlpha = 0.4;
      ctx.fillStyle = COLORS.warning;
      ctx.beginPath(); ctx.arc(0, 0, 18, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  },

  isInBladeZone(ex, ey, er) {
    const dx = ex - this.x;
    const dy = ey - this.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (dist > this.bladeRadius + er) return false;
    const angle = Math.atan2(dy, dx);
    let diff = angle - this.bladeAngle;
    while (diff >  Math.PI) diff -= 2 * Math.PI;
    while (diff < -Math.PI) diff += 2 * Math.PI;
    return Math.abs(diff) <= this.bladeArc;  // ← 使用 bladeArc 屬性
  },

  takeDamage() {
    if (this.invincible > 0) return false;
    this.hp--;
    this.invincible = 70;
    runStats.damageTaken++;
    perfectClearFlag = false;
    addParticles(this.x, this.y, '#C44B1A', 6);
    SFX.play('hit');
    return true;
  },

  draw() {
    if (currentCharacter === 'mage')        { this.drawMage();        return; }
    if (currentCharacter === 'rogue')       { this.drawRogue();       return; }
    if (currentCharacter === 'necromancer') { this.drawNecromancer(); return; }

    // 刀刃扇形光效
    ctx.save();

    // 刀刃加滿或進化時顯示金色
    const isMaxBlade = this.bladeArc >= Math.PI * 0.90 || this.soulScytheActive;
    const bladeColor1 = isMaxBlade ? 'rgba(255, 220, 80, 0.40)' : 'rgba(120, 220, 255, 0.35)';
    const bladeColor2 = isMaxBlade ? 'rgba(200, 160, 40, 0.22)' : 'rgba(80,  180, 255, 0.2)';
    const strokeColor = isMaxBlade ? 'rgba(255, 200, 80, 0.9)' : 'rgba(150, 230, 255, 0.8)';

    const grad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.bladeRadius);
    grad.addColorStop(0,   bladeColor1);
    grad.addColorStop(0.6, bladeColor2);
    grad.addColorStop(1,   'rgba(50, 130, 255, 0.0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.moveTo(this.x, this.y);
    ctx.arc(this.x, this.y, this.bladeRadius,
      this.bladeAngle - this.bladeArc,
      this.bladeAngle + this.bladeArc);
    ctx.closePath();
    ctx.fill();

    // 刀刃外弧線
    ctx.strokeStyle = strokeColor;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.bladeRadius,
      this.bladeAngle - this.bladeArc,
      this.bladeAngle + this.bladeArc);
    ctx.stroke();

    // 旋轉刀刃線條
    ctx.strokeStyle = isMaxBlade ? 'rgba(255, 230, 120, 0.95)' : 'rgba(200, 240, 255, 0.9)';
    ctx.lineWidth = 2.5;
    for (let i = 0; i < 3; i++) {
      const a = this.bladeSpinAngle + (i / 3) * Math.PI * 2;
      const endX = this.x + Math.cos(a) * this.bladeRadius * 0.8;
      const endY = this.y + Math.sin(a) * this.bladeRadius * 0.8;
      let da = a - this.bladeAngle;
      while (da >  Math.PI) da -= Math.PI * 2;
      while (da < -Math.PI) da += Math.PI * 2;
      if (Math.abs(da) <= this.bladeArc) {
        ctx.beginPath();
        ctx.moveTo(this.x, this.y);
        ctx.lineTo(endX, endY);
        ctx.stroke();
      }
    }
    ctx.restore();

    // 玩家本體 ── 板甲勇者（2.5D）
    ctx.save();
    if (this.invincible > 0 && Math.floor(this.invincible / 5) % 2 === 1) ctx.globalAlpha = 0.4;

    const fx = Math.cos(this.bladeAngle);
    const fy = Math.sin(this.bladeAngle);
    const rx = -fy, ry = fx; // 右側方向（垂直於面向）

    // 地面陰影（2.5D 強化）
    ctx.fillStyle = 'rgba(26, 22, 18, 0.5)';
    ctx.beginPath();
    ctx.ellipse(this.x + 5, this.y + this.radius + 2, this.radius * 0.92, 6, 0, 0, Math.PI * 2);
    ctx.fill();

    // 腿部（2.5D 等距視角，帶走路動畫）
    const walkCycle = Math.sin(frameCount * 0.18) * 5;
    const legBaseY = this.y + this.radius * 0.55;
    // 左腳靴子
    ctx.fillStyle = '#2A231C';   // surface（深靴）
    ctx.strokeStyle = '#1A1612'; // ink
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.ellipse(
      this.x - rx * 6 + fx * walkCycle * 0.5,
      legBaseY + walkCycle,
      5, 3.5, this.bladeAngle, 0, Math.PI * 2
    );
    ctx.fill(); ctx.stroke();
    // 右腳靴子
    ctx.beginPath();
    ctx.ellipse(
      this.x + rx * 6 - fx * walkCycle * 0.5,
      legBaseY - walkCycle,
      5, 3.5, this.bladeAngle, 0, Math.PI * 2
    );
    ctx.fill(); ctx.stroke();

    // 斗篷（面向方向後方，隨移動飄動）
    ctx.fillStyle = '#8B1A1A';
    ctx.strokeStyle = '#5A0808';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(this.x + rx * 12,  this.y + ry * 12);
    ctx.bezierCurveTo(
      this.x - fx * 6 + rx * 16, this.y - fy * 6 + ry * 16,
      this.x - fx * 20 + rx * 7, this.y - fy * 20 + ry * 7,
      this.x - fx * 23,           this.y - fy * 23
    );
    ctx.bezierCurveTo(
      this.x - fx * 20 - rx * 7, this.y - fy * 20 - ry * 7,
      this.x - fx * 6 - rx * 16, this.y - fy * 6 - ry * 16,
      this.x - rx * 12,           this.y - ry * 12
    );
    ctx.closePath();
    ctx.fill(); ctx.stroke();
    // 斗篷邊緣金色飾邊
    ctx.strokeStyle = 'rgba(200,160,30,0.5)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(this.x + rx * 11, this.y + ry * 11);
    ctx.bezierCurveTo(
      this.x - fx * 5 + rx * 15, this.y - fy * 5 + ry * 15,
      this.x - fx * 19 + rx * 7, this.y - fy * 19 + ry * 7,
      this.x - fx * 22,           this.y - fy * 22
    );
    ctx.stroke();

    // 盾牌（面向左側）
    const shX = this.x - rx * 14 + fx * 3;
    const shY = this.y - ry * 14 + fy * 3;
    ctx.save();
    ctx.translate(shX, shY);
    ctx.rotate(this.bladeAngle + Math.PI * 0.5);
    const shGrad = ctx.createLinearGradient(-7, -11, 6, 9);
    shGrad.addColorStop(0, '#CC3030');
    shGrad.addColorStop(1, '#4A0808');
    ctx.fillStyle = shGrad;
    ctx.strokeStyle = '#C8941A';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(0, -11); ctx.lineTo(7.5, -5);
    ctx.lineTo(7.5, 5); ctx.lineTo(0, 11);
    ctx.lineTo(-7.5, 5); ctx.lineTo(-7.5, -5);
    ctx.closePath();
    ctx.fill(); ctx.stroke();
    // 盾牌十字
    ctx.strokeStyle = 'rgba(255,215,0,0.8)';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(0, -6); ctx.lineTo(0, 6);
    ctx.moveTo(-4.5, 0); ctx.lineTo(4.5, 0);
    ctx.stroke();
    ctx.restore();

    // 主體板甲（冷鐵 flat --hero #6E7480 + 1px ink 邊，木刻偏移陰影）
    // 偏移陰影
    ctx.fillStyle = 'rgba(26, 22, 18, 0.55)';
    ctx.save();
    ctx.translate(this.x + 3, this.y + 3);
    ctx.rotate(this.bladeAngle);
    ctx.beginPath();
    ctx.ellipse(0, 0, this.radius * 0.88, this.radius, 0, 0, Math.PI * 2);
    ctx.restore();
    ctx.fill();
    // 主體冷鐵
    ctx.fillStyle = '#6E7480';   // --hero cold iron
    ctx.strokeStyle = '#1A1612'; // --ink (bg color as border)
    ctx.lineWidth = 1.5;
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.bladeAngle);
    ctx.beginPath();
    ctx.ellipse(0, 0, this.radius * 0.88, this.radius, 0, 0, Math.PI * 2);
    ctx.restore();
    ctx.fill();
    ctx.stroke();
    // 右側暗部（模擬 woodblock 立體感）
    ctx.fillStyle = 'rgba(26, 22, 18, 0.25)';
    ctx.save();
    ctx.translate(this.x + this.radius * 0.2, this.y);
    ctx.rotate(this.bladeAngle);
    ctx.beginPath();
    ctx.ellipse(0, 0, this.radius * 0.6, this.radius, 0, 0, Math.PI * 2);
    ctx.restore();
    ctx.fill();
    // 左上高光線（冷鐵亮邊）
    ctx.strokeStyle = 'rgba(180,190,200,0.5)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.radius - 2,
      this.bladeAngle - Math.PI * 0.6, this.bladeAngle - Math.PI * 0.15);
    ctx.stroke();
    // 胸甲聖物金飾紋（後半弧）
    ctx.strokeStyle = 'rgba(200,148,26,0.55)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.radius - 5,
      this.bladeAngle + Math.PI * 0.65, this.bladeAngle + Math.PI * 1.35);
    ctx.stroke();

    // 頭盔（冷鐵 flat + 1px ink 邊）
    const hx = this.x + fx * 6, hy = this.y + fy * 6;
    // 偏移陰影
    ctx.fillStyle = 'rgba(26, 22, 18, 0.5)';
    ctx.beginPath();
    ctx.arc(hx + 2, hy + 2, 9.5, 0, Math.PI * 2);
    ctx.fill();
    // 冷鐵主體（比甲身稍亮，模擬不同光澤）
    ctx.fillStyle = '#7A8490';
    ctx.strokeStyle = '#1A1612';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(hx, hy, 9.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    // 左側高光
    ctx.strokeStyle = 'rgba(180,190,200,0.55)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(hx, hy, 8.5, this.bladeAngle - Math.PI * 0.7, this.bladeAngle - Math.PI * 0.1);
    ctx.stroke();
    // 頭盔聖物金側飾
    ctx.strokeStyle = '#C8941A';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(hx, hy, 9.5, this.bladeAngle + Math.PI * 0.55, this.bladeAngle + Math.PI * 1.45);
    ctx.stroke();
    // 護面縫（鬼火青眼縫，無 shadowBlur）
    ctx.fillStyle = '#1A1612';
    ctx.beginPath();
    ctx.ellipse(hx + fx * 3, hy + fy * 3, 5.5, 2.2, this.bladeAngle, 0, Math.PI * 2);
    ctx.fill();
    // 鬼火青高光（--crit #5FA89C）
    ctx.fillStyle = '#5FA89C';
    ctx.beginPath();
    ctx.ellipse(hx + fx * 3, hy + fy * 3, 3.5, 1.2, this.bladeAngle, 0, Math.PI * 2);
    ctx.fill();
    // 高光點
    ctx.fillStyle = '#A8D8D0';
    ctx.beginPath();
    ctx.ellipse(hx + fx * 2.5, hy + fy * 2.5, 1.5, 0.7, this.bladeAngle, 0, Math.PI * 2);
    ctx.fill();
    // 頭頂血紅羽（配斗篷血色）
    ctx.strokeStyle = '#7B1A1A';
    ctx.lineWidth = 2.5;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(hx - rx * 1.5, hy - ry * 1.5);
    ctx.quadraticCurveTo(
      hx - fx * 3 + rx * 4, hy - fy * 3 + ry * 4,
      hx - fx * 7 + rx * 5, hy - fy * 7 + ry * 5
    );
    ctx.stroke();
    ctx.lineCap = 'butt';

    ctx.restore();

    // 速度滿級：氣流殘影（speed 超過 3.2 * 1.08^3 ≈ 4.03）
    if (this.speed > 4.0) {
      ctx.save();
      ctx.globalAlpha = 0.18;
      ctx.fillStyle = COLORS.crit; // G3：改用設計系統鬼火青 #5FA89C
      ctx.beginPath();
      ctx.arc(this.x - Math.cos(this.bladeAngle) * 14,
              this.y - Math.sin(this.bladeAngle) * 14, this.radius * 0.7, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    // 玩家血條（頭上）
    const barW = 36, barH = 5;
    const bx = this.x - barW / 2;
    const by = this.y - this.radius - 14;
    ctx.fillStyle = 'rgba(26, 22, 18, 0.7)';
    ctx.fillRect(bx - 1, by - 1, barW + 2, barH + 2);
    const hpRatio = this.hp / this.maxHp;
    ctx.fillStyle = hpRatio > 0.5 ? '#C8941A' : hpRatio > 0.25 ? '#C44B1A' : '#7B1A1A';
    ctx.fillRect(bx, by, barW * hpRatio, barH);
  },

  // ─── Phase 5：法師繪製 ───────────────────
  drawMage() {
    ctx.save();
    if (this.invincible > 0 && Math.floor(this.invincible / 5) % 2 === 1) ctx.globalAlpha = 0.4;

    const fx = Math.cos(this.bladeAngle);
    const fy = Math.sin(this.bladeAngle);
    const rx = -fy, ry = fx;

    // 地面陰影
    ctx.fillStyle = 'rgba(26, 22, 18, 0.5)';
    ctx.beginPath();
    ctx.ellipse(this.x + 5, this.y + this.radius + 2, this.radius * 0.85, 6, 0, 0, Math.PI * 2);
    ctx.fill();

    // 法袍主體（骨粉色，木刻偏移陰影）
    ctx.fillStyle = 'rgba(26, 22, 18, 0.55)';
    ctx.beginPath();
    ctx.ellipse(this.x + 3, this.y + 3, this.radius * 0.80, this.radius, this.bladeAngle + Math.PI / 2, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = COLORS.enemy;   // #D4C8A8 骨粉
    ctx.strokeStyle = COLORS.bg;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.ellipse(this.x, this.y, this.radius * 0.80, this.radius, this.bladeAngle + Math.PI / 2, 0, Math.PI * 2);
    ctx.fill(); ctx.stroke();
    // 右側暗部（木刻立體感）
    ctx.fillStyle = 'rgba(26, 22, 18, 0.22)';
    ctx.beginPath();
    ctx.ellipse(this.x + fx * this.radius * 0.18, this.y + fy * this.radius * 0.18, this.radius * 0.5, this.radius, this.bladeAngle + Math.PI / 2, 0, Math.PI * 2);
    ctx.fill();
    // xp-glow 袍緣飾紋
    ctx.strokeStyle = 'rgba(200, 148, 26, 0.42)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.ellipse(this.x, this.y, this.radius * 0.80, this.radius, this.bladeAngle + Math.PI / 2, 0, Math.PI * 2);
    ctx.stroke();

    // 法杖（面向方向延伸）
    const staffTipX = this.x + fx * (this.radius + 24);
    const staffTipY = this.y + fy * (this.radius + 24);
    ctx.strokeStyle = '#6A4E1A';   // 深木棕
    ctx.lineWidth = 3.5;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(this.x - fx * 6, this.y - fy * 6);
    ctx.lineTo(staffTipX, staffTipY);
    ctx.stroke();
    ctx.lineCap = 'butt';
    // xp-glow 杖身紋路
    ctx.strokeStyle = 'rgba(200, 148, 26, 0.5)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(this.x - fx * 4 + rx * 1, this.y - fy * 4 + ry * 1);
    ctx.lineTo(staffTipX - fx * 6 + rx * 1, staffTipY - fy * 6 + ry * 1);
    ctx.stroke();

    // 法杖魔法球（crit 鬼火青，木刻偏移法）
    const isVoidBurst = player.evolutions && player.evolutions['void_burst'];
    ctx.fillStyle = 'rgba(26, 22, 18, 0.5)';
    ctx.beginPath(); ctx.arc(staffTipX + 1.5, staffTipY + 1.5, 8, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = isVoidBurst ? '#1A0A2A' : '#1C3A34';
    ctx.beginPath(); ctx.arc(staffTipX, staffTipY, 8, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = isVoidBurst ? COLORS.xp : COLORS.crit;
    ctx.beginPath(); ctx.arc(staffTipX - 1.2, staffTipY - 1.2, 5.5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = COLORS.ink;
    ctx.globalAlpha *= 0.7;
    ctx.beginPath(); ctx.arc(staffTipX - 2.8, staffTipY - 2.8, 2.2, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = this.invincible > 0 && Math.floor(this.invincible / 5) % 2 === 1 ? 0.4 : 1;

    // 法師頭部（深色兜帽）
    const hx = this.x + fx * 5, hy = this.y + fy * 5 - 4;
    ctx.fillStyle = 'rgba(26, 22, 18, 0.5)';
    ctx.beginPath(); ctx.arc(hx + 2, hy + 2, 9.5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = COLORS.surface;   // #2A231C 深色兜帽
    ctx.strokeStyle = COLORS.bg;
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(hx, hy, 9.5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    // xp-glow 帽緣
    ctx.strokeStyle = 'rgba(200, 148, 26, 0.55)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(hx, hy, 9.5, this.bladeAngle + Math.PI * 0.45, this.bladeAngle + Math.PI * 1.55); ctx.stroke();
    // 雙眼（xp-glow 神秘光點）
    for (const side of [-1, 1]) {
      const ex = hx + rx * 3.5 * side;
      const ey = hy + ry * 3.5 * side;
      ctx.fillStyle = isVoidBurst ? COLORS.crit : COLORS.xp;
      ctx.beginPath(); ctx.arc(ex, ey, 2, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = COLORS.ink;
      ctx.beginPath(); ctx.arc(ex - 0.5, ey - 0.5, 0.7, 0, Math.PI * 2); ctx.fill();
    }

    // 速度殘影（同騎士）
    if (this.speed > 3.0) {
      ctx.save();
      ctx.globalAlpha = 0.16;
      ctx.fillStyle = COLORS.crit;
      ctx.beginPath(); ctx.arc(this.x - fx * 14, this.y - fy * 14, this.radius * 0.7, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }

    // 血條
    const barW = 36, barH = 5;
    const bx = this.x - barW / 2;
    const by = this.y - this.radius - 14;
    ctx.fillStyle = 'rgba(26, 22, 18, 0.7)';
    ctx.fillRect(bx - 1, by - 1, barW + 2, barH + 2);
    const hpRatio = this.hp / this.maxHp;
    ctx.fillStyle = hpRatio > 0.5 ? COLORS.xp : hpRatio > 0.25 ? COLORS.warning : COLORS.blood;
    ctx.fillRect(bx, by, barW * hpRatio, barH);

    ctx.restore();
  },

  // ─── Phase 6：盜賊繪製 ──────────────────
  drawRogue() {
    ctx.save();
    if (this.invincible > 0 && Math.floor(this.invincible / 5) % 2 === 1) ctx.globalAlpha = 0.4;

    const fx = Math.cos(this.bladeAngle);
    const fy = Math.sin(this.bladeAngle);
    const rx = -fy, ry = fx;  // 側向單位向量

    // 地面陰影
    ctx.fillStyle = 'rgba(26, 22, 18, 0.45)';
    ctx.beginPath();
    ctx.ellipse(this.x + 4, this.y + this.radius + 2, this.radius * 0.82, 5, 0, 0, Math.PI * 2);
    ctx.fill();

    // 衝刺殘影（dashActive 中顯示）
    if (this.dashActive > 0) {
      ctx.save();
      ctx.globalAlpha = 0.22;
      ctx.fillStyle = COLORS.blood;
      ctx.beginPath();
      ctx.ellipse(this.x - this.dashVx * 0.6, this.y - this.dashVy * 0.6,
        this.radius * 0.75, this.radius, this.bladeAngle + Math.PI / 2, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    // 身體主體（深色皮甲，木刻偏移陰影）
    ctx.fillStyle = 'rgba(26, 22, 18, 0.55)';
    ctx.beginPath();
    ctx.ellipse(this.x + 3, this.y + 3, this.radius * 0.78, this.radius, this.bladeAngle + Math.PI / 2, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#2E1E14';    // 深棕皮甲
    ctx.strokeStyle = COLORS.bg;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.ellipse(this.x, this.y, this.radius * 0.78, this.radius, this.bladeAngle + Math.PI / 2, 0, Math.PI * 2);
    ctx.fill(); ctx.stroke();
    // 暗部立體感
    ctx.fillStyle = 'rgba(26, 22, 18, 0.3)';
    ctx.beginPath();
    ctx.ellipse(this.x + fx * this.radius * 0.2, this.y + fy * this.radius * 0.2,
      this.radius * 0.48, this.radius, this.bladeAngle + Math.PI / 2, 0, Math.PI * 2);
    ctx.fill();

    // 血色腰帶 / 頭巾（blood 色橫條）
    const beltW = this.radius * 0.82;
    ctx.strokeStyle = COLORS.blood;
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(this.x - rx * beltW, this.y - ry * beltW);
    ctx.lineTo(this.x + rx * beltW, this.y + ry * beltW);
    ctx.stroke();
    // blood 腰帶高光
    ctx.strokeStyle = 'rgba(196, 75, 26, 0.45)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(this.x - rx * beltW * 0.7 - fx * 1.5, this.y - ry * beltW * 0.7 - fy * 1.5);
    ctx.lineTo(this.x + rx * beltW * 0.7 - fx * 1.5, this.y + ry * beltW * 0.7 - fy * 1.5);
    ctx.stroke();

    // 頭部（兜帽，比法師更緊湊）
    const hx = this.x + fx * this.radius * 0.55;
    const hy = this.y + fy * this.radius * 0.55;
    ctx.fillStyle = '#1A1208';    // 極深兜帽
    ctx.strokeStyle = COLORS.bg;
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(hx, hy, 9, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    // 頭巾（blood 色弧線）
    ctx.strokeStyle = COLORS.blood;
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.arc(hx, hy, 9.5, this.bladeAngle + Math.PI * 0.6, this.bladeAngle + Math.PI * 1.4);
    ctx.stroke();
    // 眼睛（muted 色，冷靜）
    for (const side of [-1, 1]) {
      const ex = hx + rx * 3 * side;
      const ey = hy + ry * 3 * side;
      ctx.fillStyle = COLORS.muted;
      ctx.beginPath(); ctx.arc(ex, ey, 1.8, 0, Math.PI * 2); ctx.fill();
    }

    // 雙匕首（腰間兩側，斜向前方）
    for (const side of [-1, 1]) {
      const kx = this.x + rx * this.radius * 0.65 * side - fx * 4;
      const ky = this.y + ry * this.radius * 0.65 * side - fy * 4;
      const kAngle = this.bladeAngle + side * 0.4;
      const kfx = Math.cos(kAngle), kfy = Math.sin(kAngle);
      // 刀柄（muted）
      ctx.strokeStyle = COLORS.muted;
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(kx - kfx * 7, ky - kfy * 7);
      ctx.lineTo(kx + kfx * 2, ky + kfy * 2);
      ctx.stroke();
      // 刀刃（ink）
      ctx.strokeStyle = COLORS.ink;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(kx + kfx * 2, ky + kfy * 2);
      ctx.lineTo(kx + kfx * 12, ky + kfy * 12);
      ctx.stroke();
    }

    // 衝刺冷卻指示（玩家腳下小弧線）
    if (this.dashCooldown > 0) {
      const dashMaxCd = Math.max(90, 180 - (player.skillLevels['dodge'] || 0) * 30);
      const cdRatio = this.dashCooldown / dashMaxCd;
      ctx.save();
      ctx.globalAlpha = 0.55;
      ctx.strokeStyle = COLORS.blood;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(this.x, this.y + this.radius + 5, 7, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * (1 - cdRatio));
      ctx.stroke();
      ctx.restore();
    }

    // 血條
    const barW2 = 36, barH2 = 5;
    const bx2 = this.x - barW2 / 2;
    const by2 = this.y - this.radius - 14;
    ctx.fillStyle = 'rgba(26, 22, 18, 0.7)';
    ctx.fillRect(bx2 - 1, by2 - 1, barW2 + 2, barH2 + 2);
    const hpRatio2 = this.hp / this.maxHp;
    ctx.fillStyle = hpRatio2 > 0.5 ? COLORS.xp : hpRatio2 > 0.25 ? COLORS.warning : COLORS.blood;
    ctx.fillRect(bx2, by2, barW2 * hpRatio2, barH2);

    ctx.restore();
  }
};

// ─────────────────────────────────────────
// 敵人
// ─────────────────────────────────────────
let enemies = [];
let enemyId = 0;

class Enemy {
  constructor(type) {
    this.id = enemyId++;
    this.type = type;
    this.dead = false;
    this.deathTimer = 0;
    this.wobble = Math.random() * Math.PI * 2;

    const margin = 30;
    const side = Math.floor(Math.random() * 4);
    if (side === 0) { this.x = Math.random() * canvas.width;  this.y = -margin; }
    else if (side === 1) { this.x = canvas.width + margin;   this.y = Math.random() * canvas.height; }
    else if (side === 2) { this.x = Math.random() * canvas.width;  this.y = canvas.height + margin; }
    else              { this.x = -margin;                    this.y = Math.random() * canvas.height; }

    // V3：HP 系統
    const HP_TABLE = { skeleton: 1, zombie: 1, elite_skeleton: 3, skeleton_archer: 2, boss: 250 };
    this.maxHp = HP_TABLE[type] || 1;
    this.hp = this.maxHp;
    this.hitCooldown = 0;   // 受傷後無敵幀（防止每幀多次扣血）
    this.flashTimer = 0;    // 受傷白色閃爍

    if (type === 'skeleton') {
      this.radius = 14;
      this.speed  = 1.4 + Math.random() * 0.8;
      this.color  = '#E8DCC4';
      this.expValue = 1;
    } else if (type === 'zombie') {
      this.radius = 19;
      this.speed  = 0.7 + Math.random() * 0.5;
      this.color  = '#7DBD7D';
      this.expValue = 3;   // 殭屍：比骷髏難打，XP 多
    } else if (type === 'elite_skeleton') {
      // V3：精英骷髏
      this.radius = 22;
      this.speed  = 1.8 + Math.random() * 0.8;
      this.color  = '#F5E642';
      this.expValue = 6;   // 精英：高速高 XP
    } else if (type === 'boss') {
      // 大魔王
      this.radius = 45;
      this.speed  = 1.3;
      this.color  = '#7B1A1A';  // --blood（大魔王）
      this.expValue = 50;
      this.shootTimer = 0;   // 8 方向箭矢
      this.dashTimer = 0;    // 衝刺攻擊
      this.isDashing = false;
      this.dashVx = 0;
      this.dashVy = 0;
    } else {
      // V3：骷髏弓箭手
      this.radius = 14;
      this.speed  = 1.2 + Math.random() * 0.6;
      this.color  = '#C8E8C8';
      this.expValue = 4;   // 弓箭手：遠程更危險，XP 稍高
      this.shootTimer = 0;
    }

    this.wanderOffset = (Math.random() - 0.5) * 0.4;
  }

  update() {
    if (this.dead) { this.deathTimer++; return; }
    const prevX = this.x, prevY = this.y; // Phase 5：冰牆減速用
    this.wobble += 0.12;
    if (this.hitCooldown > 0) this.hitCooldown--;
    if (this.flashTimer > 0) this.flashTimer--;
    if (this.slowTimer && this.slowTimer > 0) this.slowTimer--;

    // Phase 6：DoT 放血（每 60 幀掉血，不受 hitCooldown 影響）
    if (this.dotBleedTimer && this.dotBleedTimer > 0) {
      this.dotBleedTimer--;
      if (this.dotBleedTimer % 60 === 0 && !this.dead) {
        this.hp -= 1;
        this.flashTimer = 8;
        addFloatText(this.x, this.y - this.radius - 4, '🩸-1', COLORS.blood);
        if (this.hp <= 0) { killEnemy(this, false); return; }
      }
    }
    // Phase 6：DoT 毒刃（每 60 幀掉血）
    if (this.dotPoisonTimer && this.dotPoisonTimer > 0) {
      this.dotPoisonTimer--;
      if (this.dotPoisonTimer % 60 === 0 && !this.dead) {
        this.hp -= 1;
        this.flashTimer = 8;
        addFloatText(this.x, this.y - this.radius - 4, '☠-1', COLORS.muted);
        if (this.hp <= 0) { killEnemy(this, false); return; }
      }
    }

    // Phase 6：幻影目標分派（盜賊角色 + 幻影技能生效時）
    const { tx, ty } = getEnemyTarget(this);
    const dx = tx - this.x;
    const dy = ty - this.y;
    const dist = Math.sqrt(dx * dx + dy * dy);

    if (this.type === 'boss') {
      // 大魔王 AI
      this.dashTimer++;

      if (this.isDashing) {
        // 衝刺中：高速前進
        this.x += this.dashVx;
        this.y += this.dashVy;
        if (this.dashTimer >= 30) {
          this.isDashing = false;
          this.speed = 1.3;
        }
      } else if (this.dashTimer >= 240) {
        // 每 4 秒衝刺一次
        this.dashTimer = 0;
        this.isDashing = true;
        const dlen = dist || 1;
        this.dashVx = (dx / dlen) * 7;
        this.dashVy = (dy / dlen) * 7;
      } else if (dist > 1) {
        // 緩慢逼近
        this.x += (dx / dist) * this.speed;
        this.y += (dy / dist) * this.speed;
      }

      // 每 120 frames 發射 8 方向箭矢
      this.shootTimer++;
      if (this.shootTimer >= 120) {
        this.shootTimer = 0;
        for (let i = 0; i < 8; i++) {
          const angle = (i / 8) * Math.PI * 2;
          arrows.push({ x: this.x, y: this.y,
            vx: Math.cos(angle) * 4, vy: Math.sin(angle) * 4,
            life: 200, angle });
        }
      }
    } else if (this.type === 'skeleton_archer') {
      // V3：弓箭手保持距離 AI
      if (dist > 1) {
        const wob = Math.sin(this.wobble) * 0.3;
        if (dist < 150) {
          // 逃跑
          this.x -= (dx / dist) * this.speed;
          this.y -= (dy / dist) * this.speed;
        } else if (dist > 300) {
          // 靠近
          this.x += (dx / dist + wob) * this.speed;
          this.y += (dy / dist) * this.speed;
        } else {
          // 橫向保持距離
          this.x += (-dy / dist + wob) * this.speed * 0.7;
          this.y += (dx / dist) * this.speed * 0.7;
        }
      }
      this.shootTimer++;
      if (this.shootTimer >= 180) {
        this.shootTimer = 0;
        fireArrow(this.x, this.y);
      }
    } else {
      if (dist > 1) {
        const perpX = -dy / dist;
        const perpY =  dx / dist;
        this.x += (dx / dist) * this.speed + perpX * Math.sin(this.wobble + this.id) * 0.3;
        this.y += (dy / dist) * this.speed + perpY * Math.sin(this.wobble + this.id) * 0.3;
      }
    }

    // Phase 5：冰牆減速（回退移動量）
    if (this.slowTimer > 0) {
      const slowMult = (player.evolutions && player.evolutions['permafrost']) ? 0.38 : 0.52;
      this.x = prevX + (this.x - prevX) * slowMult;
      this.y = prevY + (this.y - prevY) * slowMult;
    }
  }

  draw() {
    if (this.dead) { this.drawDeath(); return; }
    ctx.save();
    // V3：受傷閃爍效果
    if (this.flashTimer > 0 && this.flashTimer % 2 === 0) ctx.globalAlpha = 0.35;
    if (this.type === 'skeleton') this.drawSkeleton();
    else if (this.type === 'zombie') this.drawZombie();
    else if (this.type === 'elite_skeleton') this.drawEliteSkeleton();
    else if (this.type === 'boss') this.drawBoss();
    else this.drawArcher();
    ctx.restore();
  }

  drawSkeleton() {
    // 天堂風骷髏戰士（2.5D）
    const x = this.x, y = this.y, r = this.radius;
    const bob = Math.sin(this.wobble) * 2;
    const swing = Math.sin(this.wobble) * 5;

    // 地面陰影
    ctx.fillStyle = 'rgba(26, 22, 18, 0.32)';
    ctx.beginPath();
    ctx.ellipse(x + 2, y + r + 1, r * 0.68, 3.5, 0, 0, Math.PI * 2);
    ctx.fill();

    // 手臂骨骼（底層先畫）
    ctx.strokeStyle = '#C8C0A4';
    ctx.lineCap = 'round';
    ctx.lineWidth = 2.5;
    ctx.beginPath(); // 左上臂
    ctx.moveTo(x - r * 0.62, y + bob + 1);
    ctx.lineTo(x - r - 4, y + bob + 5 + swing);
    ctx.stroke();
    ctx.lineWidth = 2;
    ctx.beginPath(); // 左前臂
    ctx.moveTo(x - r - 4, y + bob + 5 + swing);
    ctx.lineTo(x - r - 7, y + bob + 13 + swing * 0.6);
    ctx.stroke();
    ctx.lineWidth = 2.5;
    ctx.beginPath(); // 右上臂（持劍）
    ctx.moveTo(x + r * 0.62, y + bob + 1);
    ctx.lineTo(x + r + 4, y + bob + 4 - swing * 0.7);
    ctx.stroke();
    ctx.lineWidth = 2;
    ctx.beginPath(); // 右前臂
    ctx.moveTo(x + r + 4, y + bob + 4 - swing * 0.7);
    ctx.lineTo(x + r + 2, y + bob + 12 - swing * 0.4);
    ctx.stroke();
    ctx.lineCap = 'butt';

    // 骨骼軀幹（2.5D 漸層橢圓）
    const tGrad = ctx.createLinearGradient(x - r, y + bob - r * 0.5, x + r * 0.5, y + bob + r * 0.5);
    tGrad.addColorStop(0,   '#EEEADE');
    tGrad.addColorStop(0.5, '#C8C0A4');
    tGrad.addColorStop(1,   '#707060');
    ctx.fillStyle = tGrad;
    ctx.strokeStyle = '#454035';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.ellipse(x, y + bob, r, r * 0.88, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    // 肋骨（左右各 3 條弧線，由脊椎向外延伸）
    ctx.strokeStyle = 'rgba(65, 58, 45, 0.72)';
    ctx.lineWidth = 1.1;
    for (let i = 0; i < 3; i++) {
      const ry = y + bob - 2 + i * 4.8;
      ctx.beginPath();
      ctx.moveTo(x - 2, ry);
      ctx.quadraticCurveTo(x - r * 0.44, ry - 1.5, x - r * 0.58, ry + 3.5);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(x + 2, ry);
      ctx.quadraticCurveTo(x + r * 0.44, ry - 1.5, x + r * 0.58, ry + 3.5);
      ctx.stroke();
    }

    // 骷髏頭（天堂風，偏大）
    const sy = y + bob - r * 0.46;
    const sr = r * 0.70;
    const skGrad = ctx.createLinearGradient(x - sr, sy - sr, x + sr * 0.5, sy + sr * 0.5);
    skGrad.addColorStop(0,   '#F5F2E4');
    skGrad.addColorStop(0.55, '#D0C8B0');
    skGrad.addColorStop(1,   '#6A6250');
    ctx.fillStyle = skGrad;
    ctx.strokeStyle = '#353020';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.ellipse(x, sy, sr, sr * 1.06, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    // 眼眶（黑底 + 鬼火青，符合設計系統 --crit #5FA89C）
    for (const ex of [-r * 0.29, r * 0.29]) {
      ctx.fillStyle = '#100C06';
      ctx.beginPath();
      ctx.ellipse(x + ex, sy - 0.5, r * 0.21, r * 0.27, 0, 0, Math.PI * 2);
      ctx.fill();
      // 無 shadowBlur：用偏移填色模擬深度
      ctx.fillStyle = '#2A5048';   // 深底
      ctx.beginPath();
      ctx.ellipse(x + ex + 0.5, sy + 0.5, r * 0.13, r * 0.17, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#5FA89C';   // 鬼火青主色
      ctx.beginPath();
      ctx.ellipse(x + ex, sy - 0.5, r * 0.12, r * 0.16, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#A8D8D0';   // 高光點
      ctx.beginPath();
      ctx.ellipse(x + ex - 0.8, sy - 1.5, r * 0.055, r * 0.07, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    // 鼻孔（倒 V）
    ctx.fillStyle = '#100C06';
    ctx.beginPath();
    ctx.moveTo(x - 2,   sy + r * 0.17);
    ctx.lineTo(x,       sy + r * 0.25);
    ctx.lineTo(x + 2,   sy + r * 0.17);
    ctx.moveTo(x - 0.8, sy + r * 0.17);
    ctx.lineTo(x + 0.8, sy + r * 0.17);
    ctx.fill();

    // 下顎牙齒
    ctx.fillStyle = '#E8DCC4';   // ink
    ctx.strokeStyle = '#7A6A52'; // muted
    ctx.lineWidth = 0.8;
    for (let i = -2; i <= 1; i++) {
      ctx.beginPath();
      ctx.rect(x + i * 3.4 + 0.5, sy + r * 0.30, 2.7, 4.5);
      ctx.fill(); ctx.stroke();
    }

    // 右手鐵劍
    const swX = x + r + 3;
    const swY = y + bob + 11 - swing * 0.4;
    ctx.save();
    ctx.translate(swX, swY);
    ctx.rotate(0.25);
    ctx.strokeStyle = '#909898'; ctx.lineWidth = 2; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(0, -15); ctx.lineTo(1.5, 2); ctx.stroke();
    ctx.strokeStyle = '#606868'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(-1, -15); ctx.lineTo(0, -4); ctx.stroke(); // 刃面反光
    ctx.strokeStyle = '#7B4E20'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(-5.5, 1); ctx.lineTo(5.5, 1); ctx.stroke(); // 護手
    ctx.strokeStyle = '#9B6E30'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(0.5, 2); ctx.lineTo(0.5, 7); ctx.stroke(); // 劍柄
    ctx.lineCap = 'butt';
    ctx.restore();
  }

  drawZombie() {
    // 天堂食屍鬼 Ghoul（2.5D，駝背獵食者）
    const x = this.x, y = this.y, r = this.radius;
    const bob = Math.sin(this.wobble * 0.7) * 2;
    const lunge = Math.sin(this.wobble * 1.1) * 3; // 撲食律動

    // 地面陰影
    ctx.fillStyle = 'rgba(26, 22, 18, 0.35)';
    ctx.beginPath();
    ctx.ellipse(x + 3, y + r, r * 0.82, 4.5, 0, 0, Math.PI * 2);
    ctx.fill();

    // 腐爛肌膚底層光暈
    const aura = ctx.createRadialGradient(x, y + bob, 0, x, y + bob, r + 7);
    aura.addColorStop(0, 'rgba(60,90,50,0.0)');
    aura.addColorStop(1, 'rgba(30,60,20,0.18)');
    ctx.fillStyle = aura;
    ctx.beginPath();
    ctx.arc(x, y + bob, r + 7, 0, Math.PI * 2);
    ctx.fill();

    // 爪手（底層先畫）
    const clawSwing = Math.sin(this.wobble * 1.3) * 4;
    ctx.strokeStyle = '#4A6040';
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';
    // 左爪臂
    ctx.beginPath();
    ctx.moveTo(x - r * 0.65, y + bob - 3);
    ctx.lineTo(x - r - 5, y + bob + 4 + clawSwing);
    ctx.stroke();
    // 右爪臂
    ctx.beginPath();
    ctx.moveTo(x + r * 0.65, y + bob - 3);
    ctx.lineTo(x + r + 5, y + bob + 4 - clawSwing * 0.8);
    ctx.stroke();
    ctx.lineCap = 'butt';
    // 左爪指（3 根）
    ctx.strokeStyle = '#3A5030';
    ctx.lineWidth = 1.5;
    for (let i = -1; i <= 1; i++) {
      ctx.beginPath();
      ctx.moveTo(x - r - 5 + i * 2.5, y + bob + 4 + clawSwing);
      ctx.lineTo(x - r - 5 + i * 3.5 - 2, y + bob + 4 + clawSwing + 7);
      ctx.stroke();
    }
    // 右爪指（3 根）
    for (let i = -1; i <= 1; i++) {
      ctx.beginPath();
      ctx.moveTo(x + r + 5 + i * 2.5, y + bob + 4 - clawSwing * 0.8);
      ctx.lineTo(x + r + 5 + i * 3.5 + 2, y + bob + 4 - clawSwing * 0.8 + 7);
      ctx.stroke();
    }

    // 軀幹（食屍鬼軀體，不規則橢圓，2.5D 漸層）
    const bGrad = ctx.createLinearGradient(x - r, y + bob - r * 0.7, x + r * 0.7, y + bob + r * 0.7);
    bGrad.addColorStop(0,   '#90A878');
    bGrad.addColorStop(0.45, '#627850');
    bGrad.addColorStop(1,   '#2E4028');
    ctx.fillStyle = bGrad;
    ctx.strokeStyle = '#1A2A14';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.ellipse(x, y + bob, r, r * 0.92, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    // 肌肉腐爛暗紋
    ctx.strokeStyle = 'rgba(25, 40, 18, 0.55)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(x - 5, y + bob - r * 0.4);
    ctx.quadraticCurveTo(x - 8, y + bob, x - 4, y + bob + r * 0.5);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x + 3, y + bob - r * 0.3);
    ctx.quadraticCurveTo(x + 9, y + bob + 2, x + 5, y + bob + r * 0.45);
    ctx.stroke();

    // 食屍鬼頭顱（寬扁、低眉弓，略向前傾）
    const hx = x + lunge * 0.4, hy = y + bob - r * 0.52 + lunge * 0.2;
    const hw = r * 0.80, hh = r * 0.68;
    const hGrad = ctx.createLinearGradient(hx - hw, hy - hh * 0.8, hx + hw * 0.6, hy + hh * 0.6);
    hGrad.addColorStop(0,   '#A8C090');
    hGrad.addColorStop(0.5, '#6A8858');
    hGrad.addColorStop(1,   '#283820');
    ctx.fillStyle = hGrad;
    ctx.strokeStyle = '#1A2810';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.ellipse(hx, hy, hw, hh, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    // 眉弓（低沉突出骨骼）
    ctx.fillStyle = '#4A6038';
    ctx.beginPath();
    ctx.ellipse(hx, hy - hh * 0.5, hw * 0.75, hh * 0.18, 0, Math.PI, Math.PI * 2);
    ctx.fill();

    // 眼睛（血紅色，無 shadowBlur，木刻偏移法）
    for (const ex of [-r * 0.30, r * 0.30]) {
      ctx.fillStyle = '#0A0A08';
      ctx.beginPath();
      ctx.ellipse(hx + ex, hy - hh * 0.12, r * 0.20, r * 0.24, 0, 0, Math.PI * 2);
      ctx.fill();
      // 偏移深底（木刻陰影）
      ctx.fillStyle = '#3D0A0A';
      ctx.beginPath();
      ctx.ellipse(hx + ex + 0.5, hy - hh * 0.12 + 0.5, r * 0.13, r * 0.15, 0, 0, Math.PI * 2);
      ctx.fill();
      // 血紅主色（--blood #7B1A1A 加亮版）
      ctx.fillStyle = '#9B2A2A';
      ctx.beginPath();
      ctx.ellipse(hx + ex, hy - hh * 0.12, r * 0.12, r * 0.14, 0, 0, Math.PI * 2);
      ctx.fill();
      // 高光點
      ctx.fillStyle = '#C44B1A';
      ctx.beginPath();
      ctx.ellipse(hx + ex - 0.8, hy - hh * 0.18, r * 0.055, r * 0.065, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    // 闊口裂縫（獠牙）
    ctx.strokeStyle = '#1A2810';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(hx, hy + hh * 0.25, r * 0.45, 0.2, Math.PI - 0.2);
    ctx.stroke();
    // 獠牙
    ctx.fillStyle = '#E8E0C8';
    ctx.strokeStyle = '#706050';
    ctx.lineWidth = 0.8;
    for (const [tx, len] of [[-r*0.3, 5], [-r*0.08, 6.5], [r*0.08, 6.5], [r*0.3, 5]]) {
      ctx.beginPath();
      ctx.moveTo(hx + tx - 1.5, hy + hh * 0.22);
      ctx.lineTo(hx + tx,       hy + hh * 0.22 + len);
      ctx.lineTo(hx + tx + 1.5, hy + hh * 0.22);
      ctx.closePath();
      ctx.fill(); ctx.stroke();
    }
  }

  drawDeath() {
    const progress = this.deathTimer / 25;
    ctx.save();
    ctx.globalAlpha = Math.max(0, 1 - progress);

    if (this.type === 'skeleton' || this.type === 'elite_skeleton' || this.type === 'skeleton_archer') {
      ctx.strokeStyle = this.type === 'elite_skeleton' ? '#F5E642' : '#EDEDDF';
      ctx.lineWidth = 2.5;
      for (let i = 0; i < 6; i++) {
        const a = (i / 6) * Math.PI * 2 + this.deathTimer * 0.25;
        const r = progress * 35;
        const x1 = this.x + Math.cos(a) * r * 0.3;
        const y1 = this.y + Math.sin(a) * r * 0.3;
        const x2 = this.x + Math.cos(a) * r;
        const y2 = this.y + Math.sin(a) * r;
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.stroke();
      }
    } else {
      ctx.fillStyle = '#7A6A52';  // muted（蝕紙黃，殭屍腐爛碎片）
      for (let i = 0; i < 8; i++) {
        const a = (i / 8) * Math.PI * 2 + this.deathTimer * 0.15;
        const r = progress * 30;
        ctx.beginPath();
        ctx.arc(
          this.x + Math.cos(a) * r,
          this.y + Math.sin(a) * r,
          this.radius * (1 - progress) * 0.6, 0, Math.PI * 2
        );
        ctx.fill();
      }
    }
    ctx.restore();
  }

  // V3：受傷扣血
  takeDamage(amount = 1) {
    if (this.hitCooldown > 0) return false;
    this.hp -= amount;
    this.hitCooldown = 15;
    if (this.hp <= 0) return true;  // 死亡
    this.flashTimer = 8;            // 未死 → 閃爍
    return false;
  }

  // V3：多 HP 怪物的血條
  drawHpBar() {
    if (this.maxHp <= 1 || this.dead) return;
    const barW = 24, barH = 4;
    const bx = this.x - barW / 2, by = this.y - this.radius - 12;
    // 背景（surface）
    ctx.fillStyle = '#2A231C';
    ctx.fillRect(bx + 1, by + 1, barW, barH);  // 偏移陰影
    ctx.fillStyle = '#1A1612';
    ctx.fillRect(bx, by, barW, barH);
    // 血量（blood → warning 漸層，符合設計系統）
    const ratio = this.hp / this.maxHp;
    ctx.fillStyle = ratio > 0.5 ? '#7B1A1A' : '#C44B1A';
    ctx.fillRect(bx, by, barW * ratio, barH);
    // 邊框
    ctx.strokeStyle = '#7A6A52';
    ctx.lineWidth = 0.5;
    ctx.strokeRect(bx, by, barW, barH);
  }

  // V3：精英骷髏
  drawEliteSkeleton() {
    const x = this.x, y = this.y, r = this.radius;
    const bobY = Math.sin(this.wobble) * 2;

    // 地面陰影
    ctx.fillStyle = 'rgba(26, 22, 18, 0.32)';
    ctx.beginPath();
    ctx.ellipse(x + 2, y + r + 1, r * 0.68, 3.5, 0, 0, Math.PI * 2);
    ctx.fill();

    // 暗紅披風（精英標識，取代金色光暈）
    ctx.fillStyle = '#4A1010';
    ctx.strokeStyle = '#7B1A1A';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.ellipse(x, y + bobY + 4, r + 5, r * 0.55, 0, 0, Math.PI);
    ctx.fill();
    ctx.stroke();
    // 披風邊緣血紅細線
    ctx.strokeStyle = '#C44B1A';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(x, y + bobY, r + 6, Math.PI * 0.15, Math.PI * 0.85);
    ctx.stroke();

    // 精英骨粉主體（--enemy #D4C8A8 + 1px ink 邊）
    ctx.fillStyle = '#D4C8A8';
    ctx.strokeStyle = '#1A1612';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(x, y + bobY - 1, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    // 骨面暗部（right-side shadow，模擬 woodblock 立體感）
    ctx.fillStyle = 'rgba(26, 22, 18, 0.18)';
    ctx.beginPath();
    ctx.ellipse(x + r * 0.25, y + bobY - 1, r * 0.7, r, 0, 0, Math.PI * 2);
    ctx.fill();

    // 眼眶（黑底 + 血紅，精英更危險）
    ctx.fillStyle = '#1A1612';
    ctx.beginPath();
    ctx.ellipse(x - 6, y + bobY - 3, 4.5, 5.5, 0, 0, Math.PI * 2);
    ctx.ellipse(x + 6, y + bobY - 3, 4.5, 5.5, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#7B1A1A';
    ctx.beginPath();
    ctx.ellipse(x - 6, y + bobY - 3.5, 2.8, 3.8, 0, 0, Math.PI * 2);
    ctx.ellipse(x + 6, y + bobY - 3.5, 2.8, 3.8, 0, 0, Math.PI * 2);
    ctx.fill();
    // 眼部高光
    ctx.fillStyle = '#C44B1A';
    ctx.beginPath();
    ctx.ellipse(x - 7, y + bobY - 4.5, 1.2, 1.5, 0, 0, Math.PI * 2);
    ctx.ellipse(x + 5, y + bobY - 4.5, 1.2, 1.5, 0, 0, Math.PI * 2);
    ctx.fill();

    // 鼻孔（inkhole）
    ctx.fillStyle = '#2A1C10';
    ctx.fillRect(x - 2, y + bobY + 1, 2, 3);
    ctx.fillRect(x + 1, y + bobY + 1, 2, 3);

    // 牙齒（骨粉亮，1px ink 邊）
    ctx.fillStyle = '#E8DCC4';
    ctx.strokeStyle = '#1A1612';
    ctx.lineWidth = 0.8;
    for (let i = -2; i <= 1; i++) {
      ctx.fillRect(x + i * 4.5 - 0.5, y + bobY + 7, 4, 7);
      ctx.strokeRect(x + i * 4.5 - 0.5, y + bobY + 7, 4, 7);
    }
    this.drawHpBar();
  }

  // V3：骷髏弓箭手
  drawArcher() {
    const x = this.x, y = this.y, r = this.radius;
    const bobY = Math.sin(this.wobble) * 2;

    // 地面陰影
    ctx.fillStyle = 'rgba(26, 22, 18, 0.28)';
    ctx.beginPath();
    ctx.ellipse(x + 2, y + r + 1, r * 0.65, 3, 0, 0, Math.PI * 2);
    ctx.fill();

    // 骨粉主體（--enemy #D4C8A8 + 1px ink 邊）
    ctx.fillStyle = '#D4C8A8';
    ctx.strokeStyle = '#1A1612';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(x, y + bobY - 1, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    // 右側暗部
    ctx.fillStyle = 'rgba(26, 22, 18, 0.15)';
    ctx.beginPath();
    ctx.ellipse(x + r * 0.3, y + bobY - 1, r * 0.6, r, 0, 0, Math.PI * 2);
    ctx.fill();

    // 眼眶（黑底 + 鬼火青，與普通骷髏一致）
    ctx.fillStyle = '#1A1612';
    ctx.beginPath();
    ctx.ellipse(x - 4, y + bobY - 3, 3, 4, 0, 0, Math.PI * 2);
    ctx.ellipse(x + 4, y + bobY - 3, 3, 4, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#5FA89C';
    ctx.beginPath();
    ctx.ellipse(x - 4, y + bobY - 3.5, 1.8, 2.5, 0, 0, Math.PI * 2);
    ctx.ellipse(x + 4, y + bobY - 3.5, 1.8, 2.5, 0, 0, Math.PI * 2);
    ctx.fill();

    // 鼻孔
    ctx.fillStyle = '#2A1C10';
    ctx.fillRect(x - 1.5, y + bobY + 1, 1.5, 2.5);
    ctx.fillRect(x + 0.5, y + bobY + 1, 1.5, 2.5);

    // 弓（聖物金 --xp-glow #C8941A）
    ctx.strokeStyle = '#C8941A';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.arc(x + r + 3, y + bobY, r * 0.7, -Math.PI * 0.6, Math.PI * 0.6);
    ctx.stroke();
    // 弓弦（ink 色）
    ctx.strokeStyle = '#7A6A52';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(x + r + 3 - r * 0.42, y + bobY - r * 0.6);
    ctx.lineTo(x + r + 3 - r * 0.42, y + bobY + r * 0.6);
    ctx.stroke();
    // 弓握把金色裝飾
    ctx.strokeStyle = '#A0741A';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(x + r + 3, y + bobY - 3);
    ctx.lineTo(x + r + 3, y + bobY + 3);
    ctx.stroke();

    this.drawHpBar();
  }

  drawBoss() {
    const bobY = Math.sin(this.wobble * 0.5) * 4;
    const x = this.x, y = this.y + bobY;
    const r = this.radius;

    // 血紅色大光暈
    const aura = ctx.createRadialGradient(x, y, 0, x, y, r + 20);
    aura.addColorStop(0, 'rgba(200,0,0,0.0)');
    aura.addColorStop(1, 'rgba(180,0,0,0.35)');
    ctx.fillStyle = aura;
    ctx.beginPath();
    ctx.arc(x, y, r + 20, 0, Math.PI * 2);
    ctx.fill();

    // 骷髏頭主體（blood 暗底 + 1px ink 邊，木刻偏移陰影）
    // 偏移陰影
    ctx.fillStyle = 'rgba(26, 22, 18, 0.7)';
    ctx.beginPath();
    ctx.arc(x + 3, y + 3, r, 0, Math.PI * 2);
    ctx.fill();
    // 主體
    ctx.fillStyle = '#3A0C0C';   // 深牛血底色
    ctx.strokeStyle = '#7B1A1A'; // --blood
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    // 外圈暗紅框（雙框感）
    ctx.strokeStyle = '#C44B1A';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(x, y, r + 3, 0, Math.PI * 2);
    ctx.stroke();

    // 血紅眼睛（大魔王，無 shadowBlur，偏移木刻法）
    // 眼眶黑底 + 偏移陰影
    ctx.fillStyle = '#1A1612';
    ctx.beginPath();
    ctx.ellipse(x - 13 + 1, y - 8 + 1, 10, 12, 0, 0, Math.PI * 2);
    ctx.ellipse(x + 13 + 1, y - 8 + 1, 10, 12, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#0A0604';
    ctx.beginPath();
    ctx.ellipse(x - 13, y - 8, 9, 11, 0, 0, Math.PI * 2);
    ctx.ellipse(x + 13, y - 8, 9, 11, 0, 0, Math.PI * 2);
    ctx.fill();
    // 血紅主色（--blood 亮版）
    ctx.fillStyle = '#9B2A2A';
    ctx.beginPath();
    ctx.ellipse(x - 13, y - 8.5, 6, 7.5, 0, 0, Math.PI * 2);
    ctx.ellipse(x + 13, y - 8.5, 6, 7.5, 0, 0, Math.PI * 2);
    ctx.fill();

    // 眼睛高光（灰燼橘 --warning）
    ctx.fillStyle = '#C44B1A';
    ctx.beginPath();
    ctx.ellipse(x - 13, y - 10, 4, 5, 0, 0, Math.PI * 2);
    ctx.ellipse(x + 13, y - 10, 4, 5, 0, 0, Math.PI * 2);
    ctx.fill();

    // 鼻孔
    ctx.fillStyle = '#220000';
    ctx.fillRect(x - 5, y + 2, 4, 5);
    ctx.fillRect(x + 1, y + 2, 4, 5);

    // 牙齒（大型鋸齒）
    ctx.fillStyle = '#E8DCC4';   // ink（骨粉牙齒）
    ctx.strokeStyle = '#7A6A52'; // muted
    ctx.lineWidth = 1;
    for (let i = -3; i <= 2; i++) {
      ctx.fillRect(x + i * 8 - 1, y + 14, 6, 10);
      ctx.strokeRect(x + i * 8 - 1, y + 14, 6, 10);
    }

    // 聖物金骷髏王冠（--xp-glow，無 shadowBlur）
    ctx.fillStyle = '#C8941A';
    ctx.strokeStyle = '#A07010';
    ctx.lineWidth = 2;
    ctx.beginPath();
    // 王冠底部
    ctx.moveTo(x - r + 5, y - r + 5);
    ctx.lineTo(x + r - 5, y - r + 5);
    ctx.lineTo(x + r - 5, y - r - 10);
    // 五個齒
    const crownW = (r - 5) * 2;
    const cx0 = x - r + 5;
    for (let i = 0; i <= 4; i++) {
      const tx = cx0 + (crownW / 4) * i;
      if (i % 2 === 0) {
        ctx.lineTo(tx, y - r - 28);
      } else {
        ctx.lineTo(tx, y - r - 10);
      }
    }
    ctx.lineTo(x - r + 5, y - r - 10);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // 王冠寶石（blood 紅，符合設計系統）
    ctx.fillStyle = '#7B1A1A';
    ctx.strokeStyle = '#C44B1A';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(x, y - r - 25, 6, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = '#C44B1A';   // warning highlight
    ctx.beginPath();
    ctx.arc(x - 2, y - r - 27, 2, 0, Math.PI * 2);
    ctx.fill();
  }
}

// ─────────────────────────────────────────
// 浮動傷害/得分文字
// ─────────────────────────────────────────
let floatTexts = [];

// style: 'normal' | 'crit'
function addFloatText(x, y, text, color = '#C8941A', style = 'normal') {
  floatTexts.push({ x, y, text, color, style, life: 50, maxLife: 50, vy: -1.5 });
}

// ─────────────────────────────────────────
// 背景繪製（Offscreen Canvas 預烘焙，每幀只 drawImage）
// ─────────────────────────────────────────
const grassOffsets = [];
for (let i = 0; i < 200; i++) {
  grassOffsets.push({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    len: 5 + Math.random() * 8,
    angle: -Math.PI * 0.4 + Math.random() * 0.8,
    alpha: 0.2 + Math.random() * 0.3
  });
}

// 預烘焙靜態背景（格線 + 草葉）到 offscreen canvas
const bgCanvas = document.createElement('canvas');
bgCanvas.width  = canvas.width;
bgCanvas.height = canvas.height;
const bgCtx = bgCanvas.getContext('2d');
bgCtx.fillStyle = COLORS.bg;
bgCtx.fillRect(0, 0, bgCanvas.width, bgCanvas.height);
bgCtx.strokeStyle = 'rgba(122, 106, 82, 0.18)';
bgCtx.lineWidth = 1;
for (let x = 0; x < bgCanvas.width;  x += 50) {
  bgCtx.beginPath(); bgCtx.moveTo(x, 0); bgCtx.lineTo(x, bgCanvas.height); bgCtx.stroke();
}
for (let y = 0; y < bgCanvas.height; y += 50) {
  bgCtx.beginPath(); bgCtx.moveTo(0, y); bgCtx.lineTo(bgCanvas.width, y); bgCtx.stroke();
}
bgCtx.lineWidth = 1;
for (const g of grassOffsets) {
  bgCtx.strokeStyle = `rgba(50, 140, 50, ${g.alpha})`;
  bgCtx.beginPath();
  bgCtx.moveTo(g.x, g.y);
  bgCtx.lineTo(g.x + Math.cos(g.angle) * g.len, g.y + Math.sin(g.angle) * g.len);
  bgCtx.stroke();
}

function drawBackground() {
  ctx.drawImage(bgCanvas, 0, 0); // 單次 blit，比每幀繪製快數倍
}

// ─────────────────────────────────────────
// HUD 介面（V2 擴充）
// ─────────────────────────────────────────
function drawHUD() {
  // ── HP bar（尖角 + woodblock offset shadow）──
  ctx.fillStyle = 'rgba(26, 22, 18, 0.5)';
  ctx.fillRect(12, 12, 180, 34);
  ctx.fillStyle = COLORS.surface;
  ctx.fillRect(10, 10, 180, 34);

  const hpRatio = player.hp / player.maxHp;
  const hpColor = hpRatio > 0.3 ? COLORS.blood : COLORS.warning;
  ctx.fillStyle = hpColor;
  ctx.fillRect(14, 14, 172 * hpRatio, 26);

  ctx.strokeStyle = COLORS.muted;
  ctx.lineWidth = 1;
  ctx.strokeRect(10, 10, 180, 34);

  ctx.fillStyle = COLORS.ink;
  ctx.font = 'bold 14px "IM Fell English", serif';
  ctx.textAlign = 'left';
  ctx.fillText(`♥ ${player.hp} / ${player.maxHp}`, 20, 31);

  // ── 擊殺數面板（尖角 + offset shadow）──
  const killX = canvas.width / 2 - 80;
  ctx.fillStyle = 'rgba(26, 22, 18, 0.5)';
  ctx.fillRect(killX + 2, 10, 160, 36);
  ctx.fillStyle = COLORS.surface;
  ctx.fillRect(killX, 8, 160, 36);
  ctx.strokeStyle = COLORS.muted;
  ctx.lineWidth = 1;
  ctx.strokeRect(killX, 8, 160, 36);
  ctx.fillStyle = COLORS.xp;
  ctx.font = 'bold 22px "Pirata One", cursive';
  ctx.textAlign = 'center';
  ctx.fillText(`擊殺: ${killCount}`, canvas.width / 2, 33);

  // Phase 6：盜賊 Combo 顯示（畫面中間，擊殺數下方）
  if (currentCharacter === 'rogue' && comboCount >= 2) {
    const fadeAlpha = Math.min(1, comboTimer / 30);
    ctx.save();
    ctx.globalAlpha = fadeAlpha;
    const comboSize = Math.min(32, 18 + comboCount);
    ctx.font = `bold ${comboSize}px "Pirata One", cursive`;
    ctx.fillStyle = COLORS.xp;
    ctx.strokeStyle = COLORS.bg;
    ctx.lineWidth = 4;
    ctx.textAlign = 'center';
    ctx.strokeText(`${comboCount}× COMBO`, canvas.width / 2, 65);
    ctx.fillText(`${comboCount}× COMBO`, canvas.width / 2, 65);
    ctx.restore();
  }

  // ── 右上資訊面板（整合：時間 / Lv / 敵人數 / 技能清單）──
  const alive = aliveEnemyCount; // 由 gameLoop 每幀快取，避免重複 filter
  const owned = Object.entries(player.skillLevels).filter(([, lv]) => lv > 0);
  const panelW = 178;
  const headerH = 86;             // 時間 + Lv/敵人 兩列
  const skillCols = 4;
  const skillCellW = 40, skillCellH = 36;
  const skillRows = Math.ceil(owned.length / skillCols);
  const skillH = owned.length > 0 ? skillRows * skillCellH + 22 : 0;
  const panelX = canvas.width - panelW - 10;
  const panelY = 8;
  const panelH = headerH + skillH + 8;

  // 面板背景（尖角 + offset shadow）
  ctx.fillStyle = 'rgba(26, 22, 18, 0.5)';
  ctx.fillRect(panelX + 2, panelY + 2, panelW, panelH);
  ctx.fillStyle = 'rgba(26, 22, 18, 0.78)';
  ctx.fillRect(panelX, panelY, panelW, panelH);
  ctx.strokeStyle = COLORS.muted;
  ctx.lineWidth = 1;
  ctx.strokeRect(panelX, panelY, panelW, panelH);

  // 時間（大字）— 大魔王登場時閃灰燼橘
  const timeStr = formatTime(getGameSeconds());
  const isBossTime = bossSpawned && !bossDefeated;
  if (isBossTime) {
    const pulse = 0.55 + Math.sin(frameCount * 0.12) * 0.35;
    ctx.fillStyle = `rgba(196, 75, 26, ${pulse * 0.4})`;
    ctx.fillRect(panelX + 6, panelY + 6, panelW - 12, 32);
  }
  ctx.fillStyle = isBossTime ? COLORS.warning : COLORS.ink;
  ctx.font = 'bold 22px "Pirata One", cursive';
  ctx.textAlign = 'center';
  ctx.fillText(`⏱ ${timeStr}`, panelX + panelW / 2, panelY + 30);

  // Lv 與 敵人數
  ctx.fillStyle = COLORS.xp;
  ctx.font = 'bold 14px "IM Fell English", serif';
  ctx.textAlign = 'left';
  ctx.fillText(`Lv.${level}`, panelX + 12, panelY + 58);
  ctx.fillStyle = COLORS.warning;
  ctx.font = 'bold 13px "IM Fell English", serif';
  ctx.textAlign = 'right';
  ctx.fillText(`敵人 ${alive}`, panelX + panelW - 12, panelY + 58);

  // 靜音圖示
  ctx.font = '14px "IM Fell English", serif';
  ctx.textAlign = 'left';
  ctx.fillStyle = bgmMuted ? COLORS.muted : COLORS.ink;
  ctx.fillText(bgmMuted ? '🔇 M' : '🎵 M', panelX + 12, panelY + 78);

  // 分隔線
  if (owned.length > 0) {
    ctx.strokeStyle = COLORS.muted;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(panelX + 8,  panelY + headerH);
    ctx.lineTo(panelX + panelW - 8, panelY + headerH);
    ctx.stroke();

    // 技能標題
    ctx.fillStyle = COLORS.muted;
    ctx.font = 'bold 11px "IM Fell English", serif';
    ctx.textAlign = 'right';
    ctx.fillText('技能', panelX + panelW - 12, panelY + headerH + 13);

    // 技能格子（尖角邊框）
    const gridY = panelY + headerH + 18;
    const activePool = currentCharacter === 'mage'  ? MAGE_SKILL_POOL  :
                       currentCharacter === 'rogue' ? ROGUE_SKILL_POOL : SKILL_POOL;
    owned.forEach(([id, lv], i) => {
      const skill = activePool.find(s => s.id === id);
      if (!skill) return;
      const col = i % skillCols, row = Math.floor(i / skillCols);
      const cx = panelX + 8 + col * skillCellW + skillCellW / 2;
      const cy = gridY + row * skillCellH;
      // 格子邊框
      ctx.strokeStyle = 'rgba(122, 106, 82, 0.4)';
      ctx.lineWidth = 1;
      ctx.strokeRect(cx - skillCellW / 2 + 4, cy - 4, skillCellW - 8, skillCellH - 4);
      ctx.fillStyle = COLORS.ink;
      ctx.font = '18px "IM Fell English", serif';
      ctx.textAlign = 'center';
      ctx.fillText(skill.icon, cx, cy + 14);
      ctx.fillStyle = COLORS.xp;
      ctx.font = 'bold 10px "IM Fell English", serif';
      ctx.fillText(`Lv${lv}`, cx, cy + 28);
    });
  }

  // ── EXP 經驗條（畫面底部）──
  const barH  = 26;
  const barY  = canvas.height - barH - 6;
  const barX  = 8;
  const barW  = canvas.width - 16;
  const expRatio = Math.min(exp / expToNext(level), 1); // 真實比例（顯示百分比用）
  const dr = expDisplayRatio; // 平滑動畫比例（繪製填充用）

  // 外框背景（尖角 + offset shadow）
  ctx.fillStyle = 'rgba(26, 22, 18, 0.5)';
  ctx.fillRect(barX + 2, barY + 2, barW, barH);
  ctx.fillStyle = COLORS.surface;
  ctx.fillRect(barX, barY, barW, barH);

  // 填充漸層（深聖物金 → 亮聖物金，保留進度光感）
  if (dr > 0) {
    const grad = ctx.createLinearGradient(barX, 0, barX + barW * dr, 0);
    grad.addColorStop(0, '#8A6010');
    grad.addColorStop(1, '#E8C44A');
    ctx.fillStyle = grad;
    ctx.fillRect(barX, barY, barW * dr, barH);
  }

  // 1px muted 邊框
  ctx.strokeStyle = COLORS.muted;
  ctx.lineWidth = 1;
  ctx.strokeRect(barX, barY, barW, barH);

  // 快滿時 ink alpha pulse 邊框
  if (expRatio > 0.85) {
    const pulse = Math.sin(frameCount * 0.18) * 0.5 + 0.5;
    ctx.strokeStyle = `rgba(232, 220, 196, ${0.4 + pulse * 0.6})`;
    ctx.lineWidth = 2;
    ctx.strokeRect(barX, barY, barW, barH);
  }

  // Lv 標籤（左側）
  ctx.fillStyle = COLORS.xp;
  ctx.font = 'bold 13px "IM Fell English", serif';
  ctx.textAlign = 'left';
  ctx.fillText(`Lv.${level}`, barX + 10, barY + 17);

  // 百分比（置中）
  const pct = Math.round(expRatio * 100);
  ctx.fillStyle = COLORS.ink;
  ctx.font = 'bold 13px "IM Fell English", serif';
  ctx.textAlign = 'center';
  ctx.fillText(`${pct}%`, canvas.width / 2, barY + 17);

  // 下一級提示（右側）
  ctx.fillStyle = 'rgba(122, 106, 82, 0.85)';
  ctx.font = '11px "IM Fell English", serif';
  ctx.textAlign = 'right';
  ctx.fillText(`Lv.${level + 1} ▶`, barX + barW - 10, barY + 17);

  // 操作提示（更細小，放在 EXP 條下方邊緣）
  ctx.fillStyle = 'rgba(232, 220, 196, 0.25)';
  ctx.font = '10px "IM Fell English", serif';
  ctx.textAlign = 'left';
  ctx.fillText(isTouchDevice ? '左搖桿 移動  ·  右搖桿 武器方向' : 'WASD 移動  ·  滑鼠 控制方向', barX + 6, canvas.height - 1);
}

// ─────────────────────────────────────────
// P3：低血 Vignette（HP < 30% 時螢幕邊緣 ember 脈動）
// ─────────────────────────────────────────
function drawLowBloodVignette() {
  if (player.hp / player.maxHp >= 0.3) return;
  const pulse = 0.5 + Math.sin(frameCount * 0.105) * 0.5; // ~1Hz at 60fps
  const alpha = 0.12 + pulse * 0.14;
  const grad = ctx.createRadialGradient(
    canvas.width / 2, canvas.height / 2, canvas.height * 0.28,
    canvas.width / 2, canvas.height / 2, canvas.width * 0.75
  );
  grad.addColorStop(0, 'rgba(196, 75, 26, 0)');
  grad.addColorStop(1, `rgba(196, 75, 26, ${alpha})`);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, canvas.width, canvas.height);
}

// ─────────────────────────────────────────
// P4：升級 ink-bloom 動畫（800ms 暗墨擴散 + xp-glow 環圈）
// ─────────────────────────────────────────
function drawInkBloom() {
  if (inkBloomTimer <= 0) return;
  const progress  = 1 - inkBloomTimer / 48;
  const fadeAlpha = inkBloomTimer < 12 ? inkBloomTimer / 12 : 1;
  const radius    = 30 + progress * 340;

  // 暗墨擴散圓
  const bloom = ctx.createRadialGradient(
    canvas.width / 2, canvas.height / 2, 0,
    canvas.width / 2, canvas.height / 2, radius
  );
  bloom.addColorStop(0,    `rgba(26, 22, 18, ${fadeAlpha * 0.5})`);
  bloom.addColorStop(0.38, `rgba(26, 22, 18, ${fadeAlpha * 0.28})`);
  bloom.addColorStop(1,    'rgba(26, 22, 18, 0)');
  ctx.fillStyle = bloom;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // xp-glow 雙環（progress > 55% 時淡入）
  if (progress > 0.55) {
    const ringAlpha = Math.min((progress - 0.55) / 0.45, 1) * fadeAlpha;
    ctx.globalAlpha = ringAlpha * 0.55;
    ctx.strokeStyle = COLORS.xp;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(canvas.width / 2, canvas.height / 2, radius * 0.62, 0, Math.PI * 2);
    ctx.stroke();
    ctx.lineWidth = 1;
    ctx.globalAlpha = ringAlpha * 0.25;
    ctx.beginPath();
    ctx.arc(canvas.width / 2, canvas.height / 2, radius * 0.62 + 14, 0, Math.PI * 2);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }
  inkBloomTimer--;
}

// ─────────────────────────────────────────
// 開始畫面
// ─────────────────────────────────────────
// ─────────────────────────────────────────
// 選角畫面（Phase 5：goToCharSelect / checkCharSelectClick / drawCharSelectScreen）
// ─────────────────────────────────────────
function goToCharSelect() {
  // ── 死後審判：儲存本局統計並發放墓誌銘金幣 ──
  if (state === 'gameover' || state === 'victory') {
    runStats.level = level;
    runStats.time  = gameTime;
    lastRunStats   = { ...runStats };
    lsSet('lastRunStats', lastRunStats);
    const earned = Math.floor(runStats.kills / 5)
                 + (level - 1) * 2
                 + (bossDefeated ? 20 : 0)
                 + (perfectClearFlag && bossDefeated ? 15 : 0)
                 + 1; // 最少 1 枚
    tombCoins += earned;
    if (state === 'gameover') {
      deathCount++;
      lsSet('deathCount', deathCount);
    }
    savePersistentData();
  }
  state = 'charselect';
  BGM.stop();
  enemies = []; particles = []; floatTexts = [];
  bloodDecals = []; expGems = []; ghostOrbs = [];
  arrows = []; magicBolts = []; iceWalls = [];
  evolutionAnnouncements = []; inkBloomTimer = 0;
  updateJoystickVisibility();
}

function checkCharSelectClick(cx, cy) {
  const cardW = 180, cardH = 320, cardY = 130, gap = 18;
  const cw = canvas.width, ch = canvas.height;
  const totalW = cardW * 3 + gap * 2;
  const card1X = (cw - totalW) / 2;
  const card2X = card1X + cardW + gap;
  const card3X = card2X + cardW + gap;
  const card4X = card3X + cardW + gap;
  // 石板升級按鈕
  if (cx >= cw/2 - 175 && cx <= cw/2 - 25 && cy >= ch - 50 && cy <= ch - 18) {
    state = 'tablet'; return;
  }
  // 圖鑑按鈕
  if (cx >= cw/2 + 25 && cx <= cw/2 + 175 && cy >= ch - 50 && cy <= ch - 18) {
    state = 'codex'; return;
  }
  // 角色卡
  if (cx >= card1X && cx <= card1X + cardW && cy >= cardY && cy <= cardY + cardH) {
    currentCharacter = 'knight'; resetGame();
  } else if (cx >= card2X && cx <= card2X + cardW && cy >= cardY && cy <= cardY + cardH) {
    currentCharacter = 'mage'; resetGame();
  } else if (cx >= card3X && cx <= card3X + cardW && cy >= cardY && cy <= cardY + cardH) {
    currentCharacter = 'rogue'; resetGame();
  } else if (deathCount >= 5 && cx >= card4X && cx <= card4X + cardW && cy >= cardY && cy <= cardY + cardH) {
    currentCharacter = 'necromancer'; resetGame();
  }
}

function _drawKnightIcon() {
  ctx.fillStyle = COLORS.ink; ctx.strokeStyle = COLORS.bg; ctx.lineWidth = 1.5;
  // 頭
  ctx.beginPath(); ctx.arc(0, -30, 10, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  // 身
  ctx.fillRect(-8, -20, 16, 28); ctx.strokeRect(-8, -20, 16, 28);
  // 腿
  ctx.fillRect(-7, 8, 6, 18); ctx.strokeRect(-7, 8, 6, 18);
  ctx.fillRect(1, 8, 6, 18); ctx.strokeRect(1, 8, 6, 18);
  // 劍（右手）
  ctx.strokeStyle = COLORS.xp; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(12, -20); ctx.lineTo(30, -48); ctx.stroke();
  // 護手
  ctx.strokeStyle = COLORS.bg; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(14, -28); ctx.lineTo(22, -28); ctx.stroke();
  // 盾（左手）
  ctx.fillStyle = COLORS.muted; ctx.strokeStyle = COLORS.bg; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(-18, -8, 9, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
}

function _drawMageIcon() {
  // 袍子
  ctx.fillStyle = COLORS.ink; ctx.strokeStyle = COLORS.bg; ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(-11, -16); ctx.lineTo(-15, 26); ctx.lineTo(15, 26); ctx.lineTo(11, -16);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  // 兜帽（分兩步：半圓弧 + 方塊）
  ctx.beginPath(); ctx.arc(0, -28, 13, Math.PI, 0); ctx.fill(); ctx.stroke();
  ctx.fillRect(-13, -28, 26, 14); ctx.strokeRect(-13, -28, 26, 14);
  // 眼睛（金色）
  ctx.fillStyle = COLORS.xp;
  ctx.beginPath(); ctx.arc(-4, -30, 2.5, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(4, -30, 2.5, 0, Math.PI * 2); ctx.fill();
  // 法杖
  ctx.strokeStyle = COLORS.muted; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(14, 22); ctx.lineTo(28, -30); ctx.stroke();
  // 法球
  ctx.fillStyle = COLORS.crit; ctx.strokeStyle = COLORS.bg; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(30, -34, 7, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#AAEEE8';
  ctx.beginPath(); ctx.arc(27, -37, 2.5, 0, Math.PI * 2); ctx.fill();
}

function _drawRogueIcon() {
  // 身體（深色皮甲）
  ctx.fillStyle = '#2E1E14'; ctx.strokeStyle = COLORS.bg; ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(-10, -16); ctx.lineTo(-14, 24); ctx.lineTo(14, 24); ctx.lineTo(10, -16);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  // 頭（兜帽）
  ctx.fillStyle = '#1A1208'; ctx.strokeStyle = COLORS.bg; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(0, -26, 12, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  // 血色頭巾
  ctx.strokeStyle = COLORS.blood; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(-10, -26); ctx.lineTo(10, -26); ctx.stroke();
  // 眼睛（muted 色）
  ctx.fillStyle = COLORS.muted;
  ctx.beginPath(); ctx.arc(-4, -27, 2, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(4, -27, 2, 0, Math.PI * 2); ctx.fill();
  // 腰帶（blood）
  ctx.strokeStyle = COLORS.blood; ctx.lineWidth = 3.5;
  ctx.beginPath(); ctx.moveTo(-13, 2); ctx.lineTo(13, 2); ctx.stroke();
  // 雙匕首
  for (const side of [-1, 1]) {
    const kx = 10 * side;
    ctx.strokeStyle = COLORS.ink; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(kx, 4); ctx.lineTo(kx + side * 10, -14); ctx.stroke();
    ctx.strokeStyle = COLORS.muted; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(kx, 10); ctx.lineTo(kx, 4); ctx.stroke();
  }
}

function _drawCharCard(x, y, w, h, charType) {
  const isKnight = charType === 'knight';
  const isRogue  = charType === 'rogue';
  const isNecro  = charType === 'necromancer';
  const cx = x + w / 2;
  const hovered = mouseX >= x && mouseX <= x + w && mouseY >= y && mouseY <= y + h;

  ctx.save();
  // 卡片底色
  ctx.fillStyle = hovered ? '#2E2820' : COLORS.surface;
  ctx.fillRect(x, y, w, h);
  // 卡片邊框
  ctx.strokeStyle = hovered ? COLORS.xp : COLORS.muted;
  ctx.lineWidth = hovered ? 2.5 : 1;
  ctx.strokeRect(x, y, w, h);

  // 角色名
  ctx.fillStyle = hovered ? COLORS.xp : COLORS.ink;
  ctx.font = `bold 30px ${FONTS.display}`;
  ctx.textAlign = 'center';
  ctx.fillText(isKnight ? '騎士' : isRogue ? '盜賊' : isNecro ? '死靈師' : '法師', cx, y + 42);
  // 英文副標
  ctx.fillStyle = COLORS.muted;
  ctx.font = `italic 13px ${FONTS.body}`;
  ctx.fillText(isKnight ? 'Knight' : isRogue ? 'Rogue' : isNecro ? 'Necromancer' : 'Mage', cx, y + 60);

  // 圖示區
  const iconBoxY = y + 72, iconBoxH = 130;
  ctx.fillStyle = '#181410';
  ctx.fillRect(x + 10, iconBoxY, w - 20, iconBoxH);
  ctx.strokeStyle = COLORS.muted; ctx.lineWidth = 1;
  ctx.strokeRect(x + 10, iconBoxY, w - 20, iconBoxH);

  ctx.save();
  ctx.translate(cx, iconBoxY + iconBoxH / 2 + 5);
  if (isKnight) _drawKnightIcon(); else if (isRogue) _drawRogueIcon(); else if (isNecro) _drawNecroIcon(); else _drawMageIcon();
  ctx.restore();

  // 分隔線
  const lineY = iconBoxY + iconBoxH + 10;
  ctx.strokeStyle = COLORS.muted; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(x + 15, lineY); ctx.lineTo(x + w - 15, lineY); ctx.stroke();

  // 數值
  const statY = lineY + 18;
  ctx.font = `14px ${FONTS.body}`;
  ctx.textAlign = 'left';
  ctx.fillStyle = COLORS.muted;
  ctx.fillText('HP  :', x + 18, statY);
  ctx.fillText('SPD:', x + 18, statY + 22);
  ctx.textAlign = 'right';
  ctx.fillStyle = COLORS.xp;
  const hpVal  = isKnight ? '5' : (isRogue || isNecro) ? '4' : '3';
  const spdVal = isKnight ? '3.2' : isRogue ? '4.2' : isNecro ? '3.0' : '2.8';
  ctx.fillText(hpVal,  x + w - 18, statY);
  ctx.fillText(spdVal, x + w - 18, statY + 22);

  // 風格描述
  const descY = statY + 52;
  ctx.textAlign = 'center';
  ctx.fillStyle = COLORS.muted;
  ctx.font = `italic 12px ${FONTS.body}`;
  const lines = isKnight
    ? ['近戰旋轉刀刃', '強韌、直接、耐打']
    : isRogue
    ? ['匕首投擲＋閃避', '連殺 Combo 爆發']
    : isNecro
    ? ['鐮刀＋幽靈幻魂', '詛咒陣列、死靈收割']
    : ['遠程魔法轟炸', '脆弱但爆發力強'];
  ctx.fillText(lines[0], cx, descY);
  ctx.fillText(lines[1], cx, descY + 18);

  // hover 提示
  if (hovered) {
    ctx.fillStyle = COLORS.xp;
    ctx.font = `bold 16px ${FONTS.display}`;
    ctx.textAlign = 'center';
    ctx.fillText('▶ 選擇', cx, y + h - 12);
  }
  ctx.restore();
}

function drawCharSelectScreen() {
  const cw = canvas.width, ch = canvas.height;
  // 全螢幕暗色背景
  ctx.fillStyle = COLORS.bg;
  ctx.fillRect(0, 0, cw, ch);
  // 格線（羊皮紙紋）
  ctx.strokeStyle = 'rgba(122,106,82,0.08)';
  ctx.lineWidth = 1;
  for (let gx = 0; gx < cw; gx += 60) {
    ctx.beginPath(); ctx.moveTo(gx, 0); ctx.lineTo(gx, ch); ctx.stroke();
  }
  for (let gy = 0; gy < ch; gy += 60) {
    ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(cw, gy); ctx.stroke();
  }
  // 標題
  ctx.fillStyle = COLORS.xp;
  ctx.font = `bold 52px ${FONTS.display}`;
  ctx.textAlign = 'center';
  ctx.fillText('☠ 選擇英雄 ☠', cw / 2, 78);
  ctx.fillStyle = COLORS.muted;
  ctx.font = `italic 17px ${FONTS.body}`;
  ctx.fillText('Choose your champion', cw / 2, 106);

  // 三張角色卡（cardW=180，gap=18，三卡總寬=576，置中於 1100px canvas）
  const cardW = 180, cardH = 320, cardY = 130, gap = 18;
  const totalW = cardW * 3 + gap * 2;
  const card1X = (cw - totalW) / 2;
  const card2X = card1X + cardW + gap;
  const card3X = card2X + cardW + gap;
  _drawCharCard(card1X, cardY, cardW, cardH, 'knight');
  _drawCharCard(card2X, cardY, cardW, cardH, 'mage');
  _drawCharCard(card3X, cardY, cardW, cardH, 'rogue');

// ─────────────────────────────────────────
// 死靈師角色圖示（選角畫面）
// ─────────────────────────────────────────
// ─────────────────────────────────────────
// 石板升級畫面（state = 'tablet'）
// ─────────────────────────────────────────
let tabletClickRects = []; // 每幀重建，用於點擊偵測

function drawTabletScreen() {
  const cw = canvas.width, ch = canvas.height;
  tabletClickRects = [];

  ctx.fillStyle = COLORS.bg;
  ctx.fillRect(0, 0, cw, ch);
  // 格線
  ctx.strokeStyle = 'rgba(122,106,82,0.06)'; ctx.lineWidth = 1;
  for (let gx = 0; gx < cw; gx += 60) { ctx.beginPath(); ctx.moveTo(gx,0); ctx.lineTo(gx,ch); ctx.stroke(); }
  for (let gy = 0; gy < ch; gy += 60) { ctx.beginPath(); ctx.moveTo(0,gy); ctx.lineTo(cw,gy); ctx.stroke(); }

  // 標題
  ctx.textAlign = 'center';
  ctx.font = `bold 44px ${FONTS.display}`;
  ctx.fillStyle = COLORS.xp;
  ctx.fillText('☽ 石板升級', cw / 2, 60);
  ctx.font = `italic 16px ${FONTS.body}`;
  ctx.fillStyle = COLORS.muted;
  ctx.fillText(`墓誌銘金幣：${tombCoins} 枚`, cw / 2, 86);

  // 升級卡片（每排 3 個）
  const cardW = 170, cardH = 130, gap = 16;
  const totalW = 3 * cardW + 2 * gap;
  const startX = (cw - totalW) / 2;
  const startY = 110;

  TABLET_DEFS.forEach((def, idx) => {
    const col = idx % 3, row = Math.floor(idx / 3);
    const cx = startX + col * (cardW + gap);
    const cy = startY + row * (cardH + gap);
    const bought = stoneTabletUpgrades[def.id] || 0;
    const maxed  = bought >= def.maxBuy;
    const canAfford = tombCoins >= def.cost;

    // 陰影
    ctx.fillStyle = 'rgba(26,22,18,0.6)';
    ctx.fillRect(cx+3, cy+3, cardW, cardH);
    // 背景
    ctx.fillStyle = COLORS.surface;
    ctx.fillRect(cx, cy, cardW, cardH);
    // 邊框
    ctx.strokeStyle = maxed ? COLORS.xp : (canAfford ? COLORS.muted : '#3A3028');
    ctx.lineWidth = maxed ? 2 : 1;
    ctx.strokeRect(cx, cy, cardW, cardH);

    // 圖示
    ctx.font = '28px sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText(def.icon, cx + 10, cy + 38);

    // 名稱
    ctx.font = `bold 16px ${FONTS.display}`;
    ctx.fillStyle = maxed ? COLORS.xp : (canAfford ? COLORS.ink : COLORS.muted);
    ctx.fillText(def.name, cx + 46, cy + 32);

    // 描述
    ctx.font = `italic 12px ${FONTS.body}`;
    ctx.fillStyle = COLORS.muted;
    const words = def.desc.split(''); let line = '', lineY = cy + 52;
    for (let c of words) {
      const test = line + c;
      if (ctx.measureText(test).width > cardW - 16) {
        ctx.textAlign = 'left'; ctx.fillText(line, cx+8, lineY); lineY += 16; line = c;
      } else { line = test; }
    }
    ctx.fillText(line, cx + 8, lineY);

    // 費用 / 狀態
    ctx.textAlign = 'left';
    ctx.font = `bold 14px ${FONTS.display}`;
    if (maxed) {
      ctx.fillStyle = COLORS.xp;
      ctx.fillText('✓ 已購', cx + 8, cy + cardH - 10);
    } else {
      ctx.fillStyle = canAfford ? COLORS.xp : '#5A4030';
      ctx.fillText(`${def.cost} 幣  (${bought}/${def.maxBuy})`, cx + 8, cy + cardH - 10);
    }

    if (!maxed) tabletClickRects.push({ x:cx, y:cy, w:cardW, h:cardH, def });
  });

  // 返回按鈕
  const backY = startY + 2 * (cardH + gap) + 14;
  ctx.fillStyle = COLORS.surface;
  ctx.fillRect(cw/2 - 80, backY, 160, 34);
  ctx.strokeStyle = COLORS.muted; ctx.lineWidth = 1;
  ctx.strokeRect(cw/2 - 80, backY, 160, 34);
  ctx.font = `italic 15px ${FONTS.body}`;
  ctx.fillStyle = COLORS.muted; ctx.textAlign = 'center';
  ctx.fillText('← 返回選角', cw/2, backY + 22);
  tabletClickRects.push({ x: cw/2-80, y: backY, w: 160, h: 34, def: { id: '__back__' } });
}

function handleTabletClick(cx, cy) {
  for (const rect of tabletClickRects) {
    if (cx >= rect.x && cx <= rect.x + rect.w && cy >= rect.y && cy <= rect.y + rect.h) {
      const def = rect.def;
      if (def.id === '__back__') { state = 'charselect'; return; }
      const bought = stoneTabletUpgrades[def.id] || 0;
      if (bought >= def.maxBuy) return;
      if (tombCoins < def.cost) return;
      tombCoins -= def.cost;
      stoneTabletUpgrades[def.id] = bought + 1;
      savePersistentData();
      return;
    }
  }
}

    // 陰影 + 背景
    ctx.fillStyle = 'rgba(26,22,18,0.5)';
    ctx.fillRect(cx+3, cy+3, cardW, cardH);

    if (!unlocked) {

    }

    // 名稱
    ctx.textAlign = 'center';
    ctx.font = `bold 18px ${FONTS.display}`;
    ctx.fillStyle = COLORS.xp;
    ctx.fillText(entry.name, cx + cardW/2, cy + 22);

    // 英文副標
    ctx.font = `italic 12px ${FONTS.body}`;
    ctx.fillStyle = COLORS.muted;
    ctx.fillText(entry.title, cx + cardW/2, cy + 38);

    // 威脅星級
    let stars = '';
    for (let s = 0; s < 5; s++) stars += s < entry.threat ? '☠' : '·';
    ctx.font = `13px ${FONTS.body}`;
    ctx.fillStyle = entry.threat >= 5 ? COLORS.warning : (entry.threat >= 3 ? COLORS.xp : COLORS.muted);
    ctx.fillText(stars, cx + cardW/2, cy + 54);

    // 描述文字（自動換行）
    ctx.font = `italic 12px ${FONTS.body}`;
    ctx.fillStyle = COLORS.ink; ctx.textAlign = 'left';
    const words = entry.desc.split('');
    let line = '', lineY = cy + 72;
    for (let c of words) {
      const test = line + c;
      if (ctx.measureText(test).width > cardW - 18) {
        ctx.fillText(line, cx+9, lineY); lineY += 16; line = c;
      } else { line = test; }
    }
    ctx.fillText(line, cx + 9, lineY);

    // 擊殺統計
    ctx.textAlign = 'center';
    ctx.font = `italic 12px ${FONTS.body}`;
    ctx.fillStyle = COLORS.muted;
    ctx.fillText(`累計擊殺 ${kills} 隻`, cx + cardW/2, cy + cardH - 10);
  });

  // 返回
  const backY = startY + 2 * (cardH + gap) + 10;
  ctx.fillStyle = COLORS.surface;
  ctx.fillRect(cw/2-80, backY, 160, 34);
  ctx.strokeStyle = COLORS.muted; ctx.lineWidth=1;
  ctx.strokeRect(cw/2-80, backY, 160, 34);
  ctx.font = `italic 15px ${FONTS.body}`;
  ctx.fillStyle = COLORS.muted; ctx.textAlign = 'center';
  ctx.fillText('← 返回選角', cw/2, backY+22);
}

// 大魔王血量條（畫面頂端全寬）
// ─────────────────────────────────────────
function drawBossHpBar() {
  const boss = enemies.find(e => e.type === 'boss' && !e.dead);
  if (!boss) return;

  const barH = 36;
  const barW = canvas.width - 40;
  const bx = 20, by = 12;
  const ratio = boss.hp / boss.maxHp;

  // 外框（offset shadow + bg）
  ctx.fillStyle = 'rgba(26, 22, 18, 0.6)';
  ctx.fillRect(bx - 1, by - 1, barW + 6, barH + 6);
  ctx.fillStyle = COLORS.bg;
  ctx.fillRect(bx - 3, by - 3, barW + 6, barH + 6);

  // 背景（深 blood）
  ctx.fillStyle = '#3A0808';
  ctx.fillRect(bx, by, barW, barH);

  // 血量（暗 blood → warning 漸層，保留 boss 危險強敵的進度感）
  const grad = ctx.createLinearGradient(bx, by, bx + barW * ratio, by);
  grad.addColorStop(0, COLORS.blood);
  grad.addColorStop(1, COLORS.warning);
  ctx.fillStyle = grad;
  ctx.fillRect(bx, by, barW * ratio, barH);

  // 邊框（1px warning 尖角）
  ctx.strokeStyle = COLORS.warning;
  ctx.lineWidth = 1;
  ctx.strokeRect(bx, by, barW, barH);

  // 文字（描邊取代 shadowBlur）
  ctx.font = 'bold 14px "IM Fell English", serif';
  ctx.textAlign = 'center';
  ctx.lineWidth = 3;
  ctx.strokeStyle = COLORS.bg;
  const bossName = bossRevivesSeen >= 5 ? '老頭子' : '骷髏大魔王';
  ctx.strokeText(`☠ ${bossName}  ${boss.hp} / ${boss.maxHp}`, canvas.width / 2, by + barH - 9);
  ctx.fillStyle = COLORS.ink;
  ctx.fillText(`☠ ${bossName}  ${boss.hp} / ${boss.maxHp}`, canvas.width / 2, by + barH - 9);
}

  ctx.font = 'bold 24px "Pirata One", cursive';

}
