<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>割草遊戲 V2 - 骷髏大亂鬥</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Pirata+One&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
    body {
      background: #1A1612;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      font-family: 'IM Fell English', Georgia, serif;
    }
    #wrapper {
      position: relative;
      max-width: 100vw;
      max-height: 100vh;
    }
    canvas {
      display: block;
      border: 1px solid #7A6A52;
      box-shadow: 4px 4px 0 #2A231C;
      max-width: 100vw;
      max-height: 100vh;
      touch-action: none;
    }

    /* 觸控裝置：移除邊框 / 陰影，讓畫面貼到螢幕兩側 */
    @media (hover: none) and (pointer: coarse) {
      canvas {
        border: none;
        box-shadow: none;
      }
    }

    /* ── 虛擬搖桿（手機 / 觸控裝置）── */
    .joystick {
      position: fixed;
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: rgba(42, 35, 28, 0.6);
      border: 1px solid rgba(122, 106, 82, 0.85);
      box-shadow: 2px 2px 0 rgba(10, 8, 6, 0.5);
      touch-action: none;
      z-index: 50;
      display: none;
      pointer-events: auto;
    }
    .joystick.visible { display: block; }
    .joystick-knob {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 42px;
      height: 42px;
      margin-left: -21px;
      margin-top: -21px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #E8DCC4, #7A6A52 70%, #2A231C);
      border: 1px solid rgba(232, 220, 196, 0.5);
      pointer-events: none;
    }
    .joystick.aim {
      border-color: rgba(200, 148, 26, 0.85);
    }
    .joystick.aim .joystick-knob {
      background: radial-gradient(circle at 35% 30%, #C8941A, #7B1A1A 75%, #1A1612);
    }
    /* 搖桿固定在 viewport 兩側角落，避開 iOS Safari home indicator */
    #joystick-left  { left: 16px;  bottom: max(20px, env(safe-area-inset-bottom, 20px)); }
    #joystick-right { right: 16px; bottom: max(20px, env(safe-area-inset-bottom, 20px)); }

    /* 窄螢幕：升級選單卡片改為折行＋縮小 */
    @media (max-width: 600px) {
      #skill-cards-container { flex-wrap: wrap; gap: 10px; justify-content: center; padding: 0 10px; }
      .skill-card { width: 140px; min-height: 180px; padding: 14px 10px 12px; }
      .card-icon { font-size: 32px; }
      .card-name { font-size: 14px; }
      #upgrade-title { font-size: 26px; }
    }

    /* ── 直立旋轉提示遮罩（只在觸控裝置 + 直立時顯示）── */
    #rotate-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: #0a0f0a;
      z-index: 100;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #88FFCC;
      font-family: 'Arial', sans-serif;
      padding: 20px;
      text-align: center;
    }
    #rotate-overlay .icon {
      font-size: 80px;
      animation: rotateHint 1.6s ease-in-out infinite;
      margin-bottom: 24px;
    }
    #rotate-overlay .title {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 10px;
      color: #C8941A;  /* xp-glow */
    }
    #rotate-overlay .desc {
      font-size: 14px;
      color: #7A6A52;  /* muted */
      max-width: 320px;
      line-height: 1.6;
    }
    @keyframes rotateHint {
      0%, 100% { transform: rotate(0deg); }
      50%      { transform: rotate(-90deg); }
    }
    @media (hover: none) and (pointer: coarse) and (orientation: portrait) {
      #rotate-overlay { display: flex; }
    }

    /* ── 升級選單 overlay ── */
    #upgrade-overlay {
      display: none;
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(26, 22, 18, 0.78);
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
      animation: overlayIn 0.25s ease-out;
    }
    @keyframes overlayIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    #upgrade-title {
      color: #C8941A;
      font-family: 'Pirata One', cursive;
      font-size: 42px;
      font-weight: 400;
      margin-bottom: 8px;
      letter-spacing: 0.05em;
    }
    #upgrade-subtitle {
      color: #7A6A52;
      font-family: 'IM Fell English', serif;
      font-style: italic;
      font-size: 16px;
      margin-bottom: 28px;
    }
    #skill-cards-container {
      display: flex;
      gap: 20px;
    }
    .skill-card {
      position: relative;
      width: 160px;
      min-height: 210px;
      background: #2A231C;
      border: 1px solid #7A6A52;
      padding: 20px 14px 16px;
      text-align: center;
      cursor: pointer;
      transition: transform 0.12s, border-color 0.12s, box-shadow 0.12s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      box-shadow: 4px 4px 0 #1A1612;
      animation: cardIn 0.3s ease-out both;
    }
    .skill-card:nth-child(1) { animation-delay: 0.05s; }
    .skill-card:nth-child(2) { animation-delay: 0.12s; }
    .skill-card:nth-child(3) { animation-delay: 0.19s; }
    @keyframes cardIn {
      from { transform: translateY(30px); opacity: 0; }
      to   { transform: translateY(0);    opacity: 1; }
    }
    .skill-card:hover {
      transform: translate(-1px, -1px);
      border-color: #E8DCC4;
      box-shadow: 5px 5px 0 #1A1612;
    }
    /* Rarity 線條密度（DESIGN.md 核心 RISK：用線條而非顏色） */
    /* .common 用 .skill-card 預設細線單框，不需另外宣告 */
    .skill-card.rare {
      border: 2px double #E8DCC4;
      position: relative;
    }
    .skill-card.rare::before, .skill-card.rare::after {
      content: "❦";
      position: absolute;
      color: #7A6A52;
      font-size: 14px;
      top: 4px;
      pointer-events: none;
    }
    .skill-card.rare::before { left: 8px; }
    .skill-card.rare::after  { right: 8px; }
    .skill-card.legendary {
      border: 1px solid #E8DCC4;
      outline: 1px solid #E8DCC4;
      outline-offset: 4px;
      position: relative;
    }
    .skill-card.legendary::before, .skill-card.legendary::after {
      content: "☠";
      position: absolute;
      color: #E8DCC4;
      font-size: 18px;
      top: 8px;
      pointer-events: none;
    }
    .skill-card.legendary::before { left: 12px; }
    .skill-card.legendary::after  { right: 12px; transform: scaleX(-1); }
    /* maxed 邊框色覆蓋 rarity 邊框色 */
    .skill-card.maxed {
      border-color: #C8941A;
    }
    .skill-card.legendary.maxed {
      border-color: #C8941A;
      outline-color: #C8941A;
    }
    .skill-card.maxed:hover {
      border-color: #C8941A;
      box-shadow: 5px 5px 0 #1A1612, inset 0 0 0 1px #C8941A;
    }
    /* Double upgrade（雙倍升級）— 跟 rarity 正交，覆蓋邊框色，不影響角飾 */
    .skill-card.double {
      border: 2px solid #E8C44A;
      outline: 1px solid #C8941A;
      outline-offset: 2px;
    }
    .skill-card.double:hover {
      border-color: #E8C44A;
      box-shadow: 5px 5px 0 #1A1612, inset 0 0 0 1px #E8C44A;
    }
    .card-double-badge {
      position: absolute;
      top: -10px;
      right: -10px;
      width: 32px;
      height: 32px;
      background: #C8941A;
      color: #1A1612;
      font-family: 'Pirata One', cursive;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #E8DCC4;
      box-shadow: 2px 2px 0 #1A1612;
      z-index: 2;
    }
    /* 確保 container 不裁切徽章 */
    #skill-cards-container { overflow: visible; }
    .card-icon   { font-size: 40px; line-height: 1; color: #E8DCC4; }
    .card-name   { color: #E8DCC4; font-family: 'Pirata One', cursive; font-size: 20px; font-weight: 400; letter-spacing: 0.03em; }
    .card-level  { color: #C8941A; font-family: 'IM Fell English', serif; font-size: 13px; font-style: italic; }
    .card-desc   { color: #7A6A52; font-family: 'IM Fell English', serif; font-size: 13px; line-height: 1.45; flex: 1; }
    .card-rarity { color: #7A6A52; font-family: 'IM Fell English', serif; font-size: 10px; letter-spacing: 0.2em; padding-top: 6px; margin-top: auto; border-top: 1px solid #7A6A52; width: 100%; }

    /* ── 石板升級 overlay (on top of canvas) ── */
    #tablet-overlay {
      display: none; position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      z-index: 20;
    }
    #tablet-overlay.open { display: block; }

    /* ── AUTOPILOT bot 控制（雕版風 woodcut；無 emoji、零圓角、偏移陰影）── */
    #autopilot-panel {
      position: absolute; top: 108px; right: 8px; z-index: 25;
      display: flex; flex-direction: column; align-items: flex-end; gap: 6px;
      user-select: none;
    }
    .ap-btn {
      display: flex; align-items: center; gap: 6px;
      background: rgba(42, 35, 28, 0.5); color: #E8DCC4;
      border: 1px solid #7A6A52; border-radius: 0;
      box-shadow: 2px 2px 0 rgba(26, 22, 18, 0.4);
      padding: 6px 10px; cursor: pointer; line-height: 1;
      font-family: 'Pirata One', cursive; font-size: 16px; letter-spacing: 0.05em;
    }
    .ap-btn:hover { border-color: #C8941A; color: #C8941A; }
    .ap-btn svg { display: block; }
    /* 收起態只留半透明齒輪圖示，hover 才清晰 */
    #ap-toggle { background: transparent; border-color: transparent; box-shadow: none; opacity: 0.3; padding: 4px; }
    #ap-toggle:hover { opacity: 1; }
    /* 靜音開關：右上角半透明喇叭，靜音時顯示斜線 */
    #sound-toggle {
      position: absolute; top: 8px; right: 8px; z-index: 25;
      background: transparent; border-color: transparent; box-shadow: none;
      opacity: 0.3; padding: 4px;
    }
    #sound-toggle:hover { opacity: 1; }
    #sound-toggle .snd-slash { display: none; }
    #sound-toggle.muted { opacity: 0.6; }
    #sound-toggle.muted .snd-wave { display: none; }
    #sound-toggle.muted .snd-slash { display: block; }
    #ap-menu { display: none; flex-direction: column; align-items: flex-end; gap: 6px; }
    #ap-menu.open { display: flex; }
    .ap-lv, .ap-stop, .ap-skill { min-width: 90px; justify-content: center; font-size: 15px; }
    .ap-skill { font-family: 'IM Fell English', serif; font-size: 14px; }
    .ap-btn.active { border: 2px solid #C8941A; color: #C8941A; }
    .ap-stop { color: #C44B1A; }
    .ap-stop:hover { border-color: #C44B1A; color: #C44B1A; }
    #ap-hud {
      display: none; min-width: 132px; text-align: right; white-space: pre;
      background: transparent; color: #E8DCC4;
      border: none; border-radius: 0;
      box-shadow: none;
      padding: 6px 10px; line-height: 1.5;
      font-family: 'IM Fell English', serif; font-size: 12px;
      text-shadow: 1px 1px 0 rgba(26, 22, 18, 0.9);
    }
    #ap-hud.show { display: block; }
  </style>
</head>
<body>
<!-- 直立模式旋轉提示（觸控裝置且直立時自動顯示，由 CSS @media 控制）-->
<div id="rotate-overlay">
  <div class="icon">📱</div>
  <div class="title">請旋轉手機至橫向</div>
  <div class="desc">本遊戲需橫向遊玩，旋轉裝置後即可繼續</div>
</div>

<div id="wrapper">
  <canvas id="gameCanvas"></canvas>

  <!-- 虛擬搖桿（觸控裝置自動顯示）-->
  <div id="joystick-left" class="joystick"><div class="joystick-knob"></div></div>
  <div id="joystick-right" class="joystick aim"><div class="joystick-knob"></div></div>

  <!-- 石板升級（canvas 繪製，HTML 僅作 z-index 容器）-->
  <div id="tablet-overlay"></div>

  <!-- 升級選單 -->
  <div id="upgrade-overlay">
    <div id="upgrade-title">⬆ LEVEL UP! ⬆</div>
    <div id="upgrade-subtitle">選擇一項技能</div>
    <div id="skill-cards-container"></div>
  </div>

  <!-- 靜音開關（雕版風，hand-coded 喇叭線條，無 emoji）-->
  <div id="sound-toggle" class="ap-btn" title="靜音 / 開聲">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 9v6h3.5L13 19V5L7.5 9H4z"></path>
      <path class="snd-wave" d="M16 9.5a4 4 0 0 1 0 5 M18.6 7a8 8 0 0 1 0 10"></path>
      <line class="snd-slash" x1="3.5" y1="3.5" x2="20.5" y2="20.5" stroke="#C44B1A"></line>
    </svg>
  </div>
  <!-- AUTOPILOT bot 控制（雕版風，hand-coded 齒輪線條符號，無 emoji）-->
  <div id="autopilot-panel">
    <div id="ap-toggle" class="ap-btn" title="自動駕駛 bot（騎士）">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
        <circle cx="12" cy="12" r="3.2"></circle>
        <circle cx="12" cy="12" r="7.6" stroke-opacity="0.5"></circle>
        <path d="M12 2.4v3 M12 18.6v3 M2.4 12h3 M18.6 12h3 M5.2 5.2l2.1 2.1 M16.7 16.7l2.1 2.1 M18.8 5.2l-2.1 2.1 M7.3 16.7l-2.1 2.1"></path>
      </svg>
    </div>
    <div id="ap-menu">
      <div class="ap-btn ap-lv" data-lv="1">LV1</div>
      <div class="ap-btn ap-lv" data-lv="2">LV2</div>
      <div class="ap-btn ap-lv" data-lv="3">LV3</div>
      <div class="ap-btn ap-lv" data-lv="4">LV4</div>
      <div class="ap-btn ap-skill active" id="ap-skill">技能：自動</div>
      <div class="ap-btn ap-stop">STOP</div>
    </div>
    <div id="ap-hud"></div>
  </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
canvas.width = 1100;
canvas.height = 600;

// 修正：roundRect 不會自動 beginPath，會讓 sub-path 累積導致每幀 fill 把所有 HUD 框框
// 用最後一次的 fillStyle 填過去（症狀：HUD 全部變藍色）。改寫讓它自動開新 path。
(function patchRoundRect() {
  const orig = CanvasRenderingContext2D.prototype.roundRect;
  CanvasRenderingContext2D.prototype.roundRect = function (...args) {
    this.beginPath();
    return orig.apply(this, args);
  };
})();

// ─────────────────────────────────────────
// Design System Tokens（對應 DESIGN.md「雕版 × 鬼火」）
// 80% 畫面只用 bg/surface/ink/muted；飽和色配給制
// ─────────────────────────────────────────
const COLORS = {
  bg:      '#1A1612', // 羊皮夜：主背景，永不純黑
  surface: '#2A231C', // 羊皮陰影：卡片、面板
  ink:     '#E8DCC4', // 橡膽墨：所有文字、線條，永不純白
  muted:   '#7A6A52', // 蝕紙黃：次要、停用、格線
  hero:    '#6E7480', // 冷鐵：騎士主角
  enemy:   '#D4C8A8', // 骨粉：骷髏
  blood:   '#7B1A1A', // 牛血：HP、傷害、屍跡
  xp:      '#C8941A', // 聖物金：XP、升級、稀有
  crit:    '#5FA89C', // 鬼火青：爆擊、魔法
  warning: '#C44B1A', // 灰燼橘：低血邊緣
};
const FONTS = {
  display: '"Pirata One", cursive',  // 標題、升級、傷害大字
  body:    '"IM Fell English", serif', // HUD 標籤、技能描述、tooltip
};

// ─────────────────────────────────────────
// 古堡幽靈背景音樂（Web Audio API 程序式合成）
// ─────────────────────────────────────────
let audioMuted = false;   // 全域靜音旗標（BGM + SFX 共用）

const BGM = (() => {
  let ctx = null;
  let masterGain = null;
  let isPlaying = false;
  let scheduledNodes = [];
  let droneNodes = [];
  let nextNoteTime = 0;
  let scheduleAhead = 0.1;
  let scheduleInterval = null;
  let currentTempo = 0.38; // 秒/拍（加快節奏）

  // A 小調音階頻率（提高 4 個半音，×1.2599）
  const NOTES = {
    A3: 277.18, B3: 311.13, C4: 329.63, D4: 369.99,
    E4: 415.30, F4: 440.00, G4: 493.88, A4: 554.37,
    C5: 659.26, E5: 830.61,
  };

  // 幽靈旋律序列（A 自然小調）
  const MELODY = [
    { note: 'A3', dur: 2.4, vel: 0.18 },
    { note: 'C4', dur: 0.8, vel: 0.14 },
    { note: 'E4', dur: 1.2, vel: 0.16 },
    { note: 'D4', dur: 0.8, vel: 0.12 },
    { note: 'F4', dur: 1.6, vel: 0.15 },
    { note: 'E4', dur: 0.8, vel: 0.11 },
    { note: 'C4', dur: 1.6, vel: 0.13 },
    { note: 'A3', dur: 0.8, vel: 0.10 },
    { note: 'G4', dur: 2.0, vel: 0.14 },
    { note: 'E4', dur: 0.8, vel: 0.12 },
    { note: 'A4', dur: 1.6, vel: 0.17 },
    { note: 'G4', dur: 0.8, vel: 0.11 },
    { note: 'E4', dur: 2.4, vel: 0.14 },
    { note: 'D4', dur: 1.2, vel: 0.12 },
    { note: 'C4', dur: 1.6, vel: 0.15 },
    { note: 'B3', dur: 2.0, vel: 0.10 },
  ];
  let melodyIdx = 0;

  function ensureCtx() {
    if (!ctx) {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      masterGain = ctx.createGain();
      masterGain.gain.setValueAtTime(0.0, ctx.currentTime);
      masterGain.connect(ctx.destination);
    }
    if (ctx.state === 'suspended') ctx.resume();
  }

  function playOrganNote(freq, startTime, duration, velocity) {
    const osc1 = ctx.createOscillator();
    const osc2 = ctx.createOscillator();
    const osc3 = ctx.createOscillator();
    const gain = ctx.createGain();
    const filter = ctx.createBiquadFilter();

    osc1.type = 'sine';   osc1.frequency.value = freq;
    osc2.type = 'sine';   osc2.frequency.value = freq * 2;    // 八度泛音
    osc3.type = 'triangle'; osc3.frequency.value = freq * 3;  // 五度泛音

    const g1 = ctx.createGain(); g1.gain.value = velocity;
    const g2 = ctx.createGain(); g2.gain.value = velocity * 0.4;
    const g3 = ctx.createGain(); g3.gain.value = velocity * 0.15;

    filter.type = 'lowpass';
    filter.frequency.value = 1200;
    filter.Q.value = 0.8;

    osc1.connect(g1); g1.connect(gain);
    osc2.connect(g2); g2.connect(gain);
    osc3.connect(g3); g3.connect(gain);
    gain.connect(filter);
    filter.connect(masterGain);

    // 弱起音淡入、尾音淡出
    gain.gain.setValueAtTime(0, startTime);
    gain.gain.linearRampToValueAtTime(1, startTime + 0.12);
    gain.gain.setValueAtTime(1, startTime + duration - 0.3);
    gain.gain.linearRampToValueAtTime(0, startTime + duration);

    osc1.start(startTime); osc1.stop(startTime + duration);
    osc2.start(startTime); osc2.stop(startTime + duration);
    osc3.start(startTime); osc3.stop(startTime + duration);
    scheduledNodes.push(osc1, osc2, osc3);
  }

  function startDrone() {
    // 低沉持續音（A1 + E2）產生古堡氛圍
    const drone1 = ctx.createOscillator();
    const drone2 = ctx.createOscillator();
    const dGain = ctx.createGain();
    const dFilter = ctx.createBiquadFilter();
    const tremolo = ctx.createOscillator();
    const tremoloGain = ctx.createGain();

    drone1.type = 'sine';    drone1.frequency.value = 69.3;  // C#2（提高 4 半音）
    drone2.type = 'triangle'; drone2.frequency.value = 103.8; // G#2（提高 4 半音）

    dFilter.type = 'lowpass'; dFilter.frequency.value = 400;
    dGain.gain.value = 0.22;

    // 顫音效果（慢慢震盪，幽靈感）
    tremolo.type = 'sine'; tremolo.frequency.value = 0.15;
    tremoloGain.gain.value = 0.06;
    tremolo.connect(tremoloGain);
    tremoloGain.connect(dGain.gain);

    drone1.connect(dGain); drone2.connect(dGain);
    dGain.connect(dFilter); dFilter.connect(masterGain);
    tremolo.start(); drone1.start(); drone2.start();
    droneNodes = [drone1, drone2, dGain, tremolo];
  }

  function scheduleMelody() {
    while (nextNoteTime < ctx.currentTime + scheduleAhead * 2) {
      const step = MELODY[melodyIdx % MELODY.length];
      playOrganNote(NOTES[step.note], nextNoteTime, step.dur * currentTempo * 0.85, step.vel);
      nextNoteTime += step.dur * currentTempo;
      melodyIdx++;
    }
  }

  return {
    start() {
      if (isPlaying) return;
      ensureCtx();
      isPlaying = true;
      nextNoteTime = ctx.currentTime + 0.1;
      startDrone();
      // 淡入
      masterGain.gain.cancelScheduledValues(ctx.currentTime);
      masterGain.gain.linearRampToValueAtTime(audioMuted ? 0 : 0.7, ctx.currentTime + 2.0); // 音量降低 30%（靜音時 0）
      scheduleInterval = setInterval(() => scheduleMelody(), 80);
      scheduleMelody();
    },
    stop() {
      if (!isPlaying) return;
      isPlaying = false;
      clearInterval(scheduleInterval);
      if (masterGain) {
        masterGain.gain.cancelScheduledValues(ctx.currentTime);
        masterGain.gain.linearRampToValueAtTime(0, ctx.currentTime + 1.5);
      }
      setTimeout(() => {
        droneNodes.forEach(n => { try { n.stop && n.stop(); n.disconnect && n.disconnect(); } catch(e){} });
        droneNodes = [];
        scheduledNodes.forEach(n => { try { n.disconnect && n.disconnect(); } catch(e){} });
        scheduledNodes = [];
        melodyIdx = 0;
      }, 1600);
    },
    setVolume(v) {
      if (masterGain) masterGain.gain.setTargetAtTime(v, ctx.currentTime, 0.3);
    },
    isRunning() { return isPlaying; }
  };
})();

// 音效系統（Web Audio API，無需外部音效檔）
// ─────────────────────────────────────────
const SFX = (() => {
  let _ctx = null;
  function ac() {
    if (!_ctx) _ctx = new (window.AudioContext || window.webkitAudioContext)();
    return _ctx;
  }

  // 單一音調
  function tone(freq, type, dur, vol = 0.3, delay = 0) {
    if (audioMuted) return;
    const c = ac();
    const osc = c.createOscillator();
    const gain = c.createGain();
    osc.connect(gain);
    gain.connect(c.destination);
    osc.type = type;
    osc.frequency.setValueAtTime(freq, c.currentTime + delay);
    gain.gain.setValueAtTime(vol, c.currentTime + delay);
    gain.gain.exponentialRampToValueAtTime(0.001, c.currentTime + delay + dur);
    osc.start(c.currentTime + delay);
    osc.stop(c.currentTime + delay + dur + 0.01);
  }

  // 白噪音（擊打感）
  function noise(dur, vol = 0.2) {
    if (audioMuted) return;
    const c = ac();
    const buf = c.createBuffer(1, Math.floor(c.sampleRate * dur), c.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
    const src = c.createBufferSource();
    src.buffer = buf;
    const gain = c.createGain();
    src.connect(gain);
    gain.connect(c.destination);
    gain.gain.setValueAtTime(vol, c.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, c.currentTime + dur);
    src.start();
    src.stop(c.currentTime + dur + 0.01);
  }

  const sounds = {
    slash:     () => noise(0.07, 0.25),                                         // 刀刃砍怪
    hit:       () => { tone(110, 'sawtooth', 0.25, 0.5); tone(75, 'square', 0.2, 0.3, 0.05); }, // 玩家受傷
    gem:       () => tone(1200, 'sine', 0.09, 0.12),                            // 撿寶石
    levelup:   () => [523, 659, 784, 1047].forEach((f,i) => tone(f, 'sine', 0.18, 0.28, i*0.09)), // 升級
    gameover:  () => [350, 260, 180, 130].forEach((f,i) => tone(f, 'sawtooth', 0.45, 0.35, i*0.18)), // 死亡
    evolution: () => {                                                            // 武器進化
      [523, 659, 784, 1047].forEach((f,i) => tone(f, 'sine', 0.5, 0.32, i*0.1));
      tone(1568, 'sine', 0.9, 0.38, 0.45);
    },
    arrow:     () => noise(0.04, 0.18),                                          // 箭矢命中
  };

  return {
    play(type) {
      try { sounds[type]?.(); } catch(e) {}
    }
  };
})();

function setupJoystick(elId, stateObj) {
  const el = document.getElementById(elId);
  const knob = el.querySelector('.joystick-knob');
  const radius = 42; // 搖桿桿子最大位移半徑

  function getCenter() {
    const r = el.getBoundingClientRect();
    return { cx: r.left + r.width / 2, cy: r.top + r.height / 2 };
  }
  function updateKnob(dx, dy) {
    knob.style.transform = `translate(${dx}px, ${dy}px)`;
  }
  function resetKnob() {
    knob.style.transform = 'translate(0px, 0px)';
  }
  function pickTouch(e) {
    for (const t of e.changedTouches) {
      const r = el.getBoundingClientRect();
      if (t.clientX >= r.left && t.clientX <= r.right
       && t.clientY >= r.top  && t.clientY <= r.bottom) return t;
    }
    return null;
  }
  function findTouchById(touches, id) {
    for (const t of touches) if (t.identifier === id) return t;
    return null;
  }

  el.addEventListener('touchstart', e => {
    const t = pickTouch(e);
    if (!t) return;
    e.preventDefault();
    stateObj.active = true;
    stateObj.touchId = t.identifier;
    const { cx, cy } = getCenter();
    let dx = t.clientX - cx, dy = t.clientY - cy;
    const len = Math.hypot(dx, dy);
    if (len > radius) { dx = dx / len * radius; dy = dy / len * radius; }
    stateObj.x = dx / radius;
    stateObj.y = dy / radius;
    updateKnob(dx, dy);
  }, { passive: false });

  el.addEventListener('touchmove', e => {
    if (!stateObj.active) return;
    const t = findTouchById(e.touches, stateObj.touchId);
    if (!t) return;
    e.preventDefault();
    const { cx, cy } = getCenter();
    let dx = t.clientX - cx, dy = t.clientY - cy;
    const len = Math.hypot(dx, dy);
    if (len > radius) { dx = dx / len * radius; dy = dy / len * radius; }
    stateObj.x = dx / radius;
    stateObj.y = dy / radius;
    updateKnob(dx, dy);
  }, { passive: false });

  function endTouch(e) {
    const t = findTouchById(e.changedTouches, stateObj.touchId);
    if (!t && stateObj.touchId !== null) return;
    stateObj.active = false;
    stateObj.touchId = null;
    stateObj.x = 0;
    stateObj.y = 0;
    resetKnob();
  }
  el.addEventListener('touchend', endTouch);
  el.addEventListener('touchcancel', endTouch);
}

    exp -= expToNext(level);

    triggerUpgrade();
    break; // 一次只觸發一次升級，下一局繼續

}

function pickUpgradeOptions() {
  const levels = player.skillLevels;
  const activePool = currentCharacter === 'mage'        ? MAGE_SKILL_POOL        :
                     currentCharacter === 'rogue'       ? ROGUE_SKILL_POOL       :
                     currentCharacter === 'necromancer' ? NECROMANCER_SKILL_POOL : SKILL_POOL;
  // 優先未滿級的技能
  let available = activePool.filter(s => (levels[s.id] || 0) < s.maxLevel);
  // early_rare 石板升級：低等級可見稀有/傳奇
  if (!stoneTabletUpgrades['early_rare']) {
    if (level < 4) available = available.filter(s => s.rarity === 'common' || Math.random() < 0.25);
  }

  // cycle reset：全部滿級則允許重選
  if (available.length === 0) {
    available = [...activePool];
  }

  // Fisher-Yates shuffle
  const shuffled = [...available];
  for (let i = shuffled.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
  }
  // extra_card 石板升級：3→4 張
  const cardCount = stoneTabletUpgrades['extra_card'] ? 4 : 3;
  const picks = shuffled.slice(0, Math.min(cardCount, shuffled.length));

  // 雙倍升級：每次至多 1 張卡標記為 bonusLevel: 2，降低初始難度
  // 機率隨 player level 遞減：Lv ≤ 3 20% / ≤ 7 10% / 之後 5%
  const doubleChance = level <= 3 ? 0.20 : level <= 7 ? 0.10 : 0.05;
  if (picks.length > 0 && Math.random() < doubleChance) {
    const idx = Math.floor(Math.random() * picks.length);
    picks[idx] = { ...picks[idx], bonusLevel: 2 };
  }
  return picks;
}

function applySkill(id, times = 1) {
  const activePool = currentCharacter === 'mage'        ? MAGE_SKILL_POOL        :
                     currentCharacter === 'rogue'       ? ROGUE_SKILL_POOL       :
                     currentCharacter === 'necromancer' ? NECROMANCER_SKILL_POOL : SKILL_POOL;
  const skill = activePool.find(s => s.id === id);
  if (!skill) return;
  for (let i = 0; i < times; i++) {
    skill.apply(player);
    if (!player.skillLevels[id]) player.skillLevels[id] = 0;
    player.skillLevels[id]++;
  }
  checkEvolutions(); // V3：檢查武器進化條件
}

function showUpgradeMenu(options) {
  const container = document.getElementById('skill-cards-container');
  container.innerHTML = '';
  options.forEach(skill => {
    const currentLv = player.skillLevels[skill.id] || 0;
    const nextLv = currentLv + 1;
    const isCycleReset = currentLv >= skill.maxLevel;
    const rarity = skill.rarity || 'common';
    const isDouble = skill.bonusLevel === 2;
    const card = document.createElement('div');
    card.className = `skill-card ${rarity}` + (isDouble ? ' double' : '') + (isCycleReset ? ' maxed' : '');
    const rarityLabel = { common: 'COMMON', rare: 'RARE', legendary: 'LEGENDARY' }[rarity];
    const lvLabel = isDouble
      ? (isCycleReset ? '✨ 強化加成 ×2' : `Lv ${nextLv} → ${nextLv + 1}`)
      : (isCycleReset ? '✨ 強化加成' : `Lv ${nextLv}`);
    const doubleBadge = isDouble ? '<div class="card-double-badge">×2</div>' : '';
    card.innerHTML = `
      ${doubleBadge}
      <div class="card-icon">${skill.icon}</div>
      <div class="card-name">${skill.name}</div>
      <div class="card-level">${lvLabel}</div>
      <div class="card-desc">${skill.desc}</div>
      <div class="card-rarity">${rarityLabel}</div>
    `;
    card.onclick = () => {
      applySkill(skill.id, isDouble ? 2 : 1);
      hideUpgradeMenu();
      // 解凍後給玩家 30 frames 無敵緩衝（不立刻被打）
      player.invincible = Math.max(player.invincible, 30);
      state = 'playing';
    };
    container.appendChild(card);
  });
  document.getElementById('upgrade-overlay').style.display = 'flex';
}

function hideUpgradeMenu() {
  document.getElementById('upgrade-overlay').style.display = 'none';
}

function getGameSeconds() { return Math.floor(gameTime / 60); }
function formatTime(s) {
  const m = Math.floor(s / 60);
  return `${String(m).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
}
function getEnemyTypeByTime() {
  const s = getGameSeconds();
  const r = Math.random();
  // 第二幕：腐敗森林（40 擊殺後），弓箭手比例大增
  if (actPhase >= 1) {
    if (r < 0.25) return 'skeleton';
    if (r < 0.45) return 'zombie';
    if (r < 0.65) return 'elite_skeleton';
    return 'skeleton_archer';
  }
  // 第一幕：按時間分佈
  if (s < 60) {
    return r < 0.70 ? 'skeleton' : 'zombie';
  } else if (s < 120) {
    if (r < 0.60) return 'skeleton';
    if (r < 0.82) return 'zombie';
    return 'elite_skeleton';
  } else if (s < 300) {
    if (r < 0.45) return 'skeleton';
    if (r < 0.65) return 'zombie';
    if (r < 0.82) return 'elite_skeleton';
    return 'skeleton_archer';
  } else {
    if (r < 0.30) return 'skeleton';
    if (r < 0.50) return 'zombie';
    if (r < 0.70) return 'elite_skeleton';
    return 'skeleton_archer';
  }
}

function fireArrow(fromX, fromY) {
  const dx = player.x - fromX, dy = player.y - fromY;
  const dist = Math.sqrt(dx * dx + dy * dy) || 1;
  arrows.push({
    x: fromX, y: fromY,
    vx: (dx / dist) * 4.5,
    vy: (dy / dist) * 4.5,
    life: 150,
    angle: Math.atan2(dy, dx)
  });
}

function updateArrows() {
  for (const a of arrows) {
    a.x += a.vx;
    a.y += a.vy;
    a.life--;
    if (player.invincible <= 0 &&
        circleCollide(a.x, a.y, 5, player.x, player.y, player.radius)) {
      SFX.play('arrow');
      if (player.takeDamage()) {
        addFloatText(player.x, player.y - 25, '-1', '#C44B1A');
        if (player.hp <= 0) { SFX.play('gameover'); state = 'gameover'; BGM.stop(); }
      }
      a.life = 0;
    }
  }
  arrows = arrows.filter(a => a.life > 0);
}

function drawArrows() {
  ctx.strokeStyle = '#DEB887';
  ctx.lineWidth = 4;
  for (const a of arrows) {
    ctx.save();
    ctx.translate(a.x, a.y);
    ctx.rotate(a.angle);
    ctx.beginPath();
    ctx.moveTo(-18, 0); ctx.lineTo(14, 0);   // 箭桿（2×）
    ctx.moveTo(14, 0);  ctx.lineTo(6, -6);   // 箭頭上（2×）
    ctx.moveTo(14, 0);  ctx.lineTo(6, 6);    // 箭頭下（2×）
    ctx.stroke();
    ctx.restore();
  }
}

// Phase 5：魔法彈系統
// ─────────────────────────────────────────
function fireMagicBolt() {
  const boltCount   = 2 + (player.skillLevels['scatter'] || 0); // 基礎 2 顆
  const baseSpeed   = 5.5 + (player.skillLevels['bolt_speed'] || 0) * 0.9;
  const isVoidBurst = player.evolutions && player.evolutions['void_burst'];
  const pierceBase  = isVoidBurst ? 999 : (player.skillLevels['frost_pierce'] || 0);
  const blastLv     = player.skillLevels['blast_boost'] || 0;
  const baseRadius  = isVoidBurst ? 13 : 7;
  const boltRadius  = baseRadius + blastLv * 5; // 爆裂強化每級 +5px

  for (let i = 0; i < boltCount; i++) {
    let spread = 0;
    if (boltCount > 1) {
      const maxSpread = boltCount <= 2 ? 0.32 : 0.55;
      spread = (i / (boltCount - 1) - 0.5) * maxSpread;
    }
    const angle = player.bladeAngle + spread;
    magicBolts.push({
      x: player.x, y: player.y,
      vx: Math.cos(angle) * baseSpeed,
      vy: Math.sin(angle) * baseSpeed,
      life: 220, maxLife: 220,
      radius: boltRadius,
      pierceLeft: pierceBase,
      hitSet: new Set(),
    });
  }
}

function updateMagicBolts() {
  const isVoidBurst = player.evolutions && player.evolutions['void_burst'];
  const chainCount  = isVoidBurst ? 99 : (player.skillLevels['chain_lightning'] || 0);
  const chainRange  = 140;
  const blastLv     = player.skillLevels['blast_boost'] || 0;
  const boltDmg     = 2 + ((blastLv >= 3) ? 1 : 0); // 基礎 2，滿級爆裂強化 +1 = 3
  const chainDmg    = Math.max(1, boltDmg - 1);     // 連鎖比主擊少 1

  for (const bolt of magicBolts) {
    bolt.x += bolt.vx;
    bolt.y += bolt.vy;
    bolt.life--;

    for (const e of enemies) {
      if (e.dead || bolt.hitSet.has(e.id)) continue;
      if (!circleCollide(bolt.x, bolt.y, bolt.radius, e.x, e.y, e.radius)) continue;

      bolt.hitSet.add(e.id);

      // 連鎖閃電
      if (chainCount > 0) {
        let chains = 0;
        for (const other of enemies) {
          if (chains >= chainCount) break;
          if (other.dead || other.id === e.id || bolt.hitSet.has(other.id)) continue;
          if (circleCollide(e.x, e.y, chainRange, other.x, other.y, other.radius)) {
            bolt.hitSet.add(other.id);
            if (other.takeDamage(chainDmg)) killEnemy(other, false);
            else addFloatText(other.x, other.y - other.radius - 5, '⚡', COLORS.crit, 'crit');
            chains++;
          }
        }
      }

      const died = e.takeDamage(boltDmg);
      if (died) {
        // 靈魂汲取：只有直擊命中才回血（V3 規則）
        if ((player.skillLevels['soul_drain'] || 0) > 0 && player.hp < player.maxHp) {
          player.hp = Math.min(player.hp + 1, player.maxHp);
          addFloatText(player.x, player.y - 28, '+1 ♥', COLORS.xp);
        }
        killEnemy(e, true);
      }

      if (bolt.pierceLeft > 0) {
        bolt.pierceLeft--;   // 穿透：不移除彈丸
      } else {
        bolt.life = 0;
        break;
      }
    }
    // 飛出邊界
    if (bolt.x < -60 || bolt.x > canvas.width + 60 || bolt.y < -60 || bolt.y > canvas.height + 60) {
      bolt.life = 0;
    }
  }
  magicBolts = magicBolts.filter(b => b.life > 0);
}

function drawMagicBolts() {
  const isVoidBurst = player.evolutions && player.evolutions['void_burst'];
  for (const bolt of magicBolts) {
    const alpha = bolt.life / bolt.maxLife;
    ctx.save();
    ctx.globalAlpha = alpha;
    // 偏移陰影（woodblock）
    ctx.fillStyle = 'rgba(26, 22, 18, 0.5)';
    ctx.beginPath(); ctx.arc(bolt.x + 1.5, bolt.y + 1.5, bolt.radius, 0, Math.PI * 2); ctx.fill();
    // 主體深色
    ctx.fillStyle = isVoidBurst ? '#1A0820' : '#1C3A34';
    ctx.beginPath(); ctx.arc(bolt.x, bolt.y, bolt.radius, 0, Math.PI * 2); ctx.fill();
    // 主色
    ctx.fillStyle = isVoidBurst ? COLORS.xp : COLORS.crit;
    ctx.beginPath(); ctx.arc(bolt.x - bolt.radius * 0.15, bolt.y - bolt.radius * 0.15, bolt.radius * 0.7, 0, Math.PI * 2); ctx.fill();
    // 高光
    ctx.fillStyle = COLORS.ink;
    ctx.globalAlpha = alpha * 0.65;
    ctx.beginPath(); ctx.arc(bolt.x - bolt.radius * 0.35, bolt.y - bolt.radius * 0.35, bolt.radius * 0.28, 0, Math.PI * 2); ctx.fill();
    // void_burst：外環光暈
    if (isVoidBurst) {
      ctx.globalAlpha = alpha * 0.28;
      ctx.strokeStyle = COLORS.xp;
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(bolt.x, bolt.y, bolt.radius + 7, 0, Math.PI * 2); ctx.stroke();
    }
    ctx.restore();
  }
}

// 以太光束 — 進化「以太光束」每 1.5 秒掃射一道（寬幅，每 tick 高傷）
function spawnBeam(x, y, angle) {
  beams.push({
    x, y,
    angle,
    length: 900,
    width: 54,
    life: 36,
    maxLife: 36,
    tick: 4, // 第一次 tick 立刻觸發
    hitSet: new Set(),
  });
  addParticles(x, y, COLORS.crit, 12);
}

function updateBeams() {
  for (const b of beams) {
    b.life--;
    b.tick++;
    if (b.tick < 4) continue;
    b.tick = 0;
    const cosA = Math.cos(b.angle), sinA = Math.sin(b.angle);
    const halfW = b.width / 2;
    for (const e of enemies) {
      if (e.dead) continue;
      const dx = e.x - b.x, dy = e.y - b.y;
      const along = dx * cosA + dy * sinA;
      if (along < 0 || along > b.length) continue;
      const perp = Math.abs(-dx * sinA + dy * cosA);
      if (perp > halfW + e.radius) continue;
      const died = e.takeDamage(2);
      if (died) killEnemy(e, false); // 光束為 AOE，不觸發 soul_drain（V3）
    }
  }
  beams = beams.filter(b => b.life > 0);
}

function drawBeams() {
  for (const b of beams) {
    const alpha = b.life / b.maxLife;
    const cosA = Math.cos(b.angle), sinA = Math.sin(b.angle);
    const ex = b.x + cosA * b.length, ey = b.y + sinA * b.length;
    ctx.save();
    ctx.lineCap = 'round';
    // 雕版深色外框
    ctx.globalAlpha = alpha * 0.85;
    ctx.strokeStyle = COLORS.ink;
    ctx.lineWidth = b.width + 4;
    ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(ex, ey); ctx.stroke();
    // 主色 crit 青
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = COLORS.crit;
    ctx.lineWidth = b.width;
    ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(ex, ey); ctx.stroke();
    // 內芯 ink 細線（鬼火高光）
    ctx.globalAlpha = alpha * 0.9;
    ctx.strokeStyle = COLORS.ink;
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(ex, ey); ctx.stroke();
    ctx.lineCap = 'butt';
    ctx.restore();
  }
}

function updateIceWalls() {
  if (!(player.skillLevels['ice_wall'] > 0)) return;
  iceWallTimer++;
  const cd = 480; // 8 秒
  if (iceWallTimer >= cd) {
    iceWallTimer = 0;
    const angle  = Math.random() * Math.PI * 2;
    const dist   = 80 + Math.random() * 60;
    const isPerm = player.evolutions && player.evolutions['permafrost'];
    const baseR  = 70 + (player.skillLevels['ice_wall'] - 1) * 20;
    iceWalls.push({
      x: player.x + Math.cos(angle) * dist,
      y: player.y + Math.sin(angle) * dist,
      radius: isPerm ? baseR * 2 : baseR,
      life: 180, maxLife: 180,
    });
    addFloatText(player.x, player.y - 32, '❄ 冰牆', COLORS.crit);
  }
  for (const wall of iceWalls) {
    wall.life--;
    for (const e of enemies) {
      if (!e.dead && circleCollide(wall.x, wall.y, wall.radius, e.x, e.y, e.radius)) {
        e.slowTimer = 12; // 每幀刷新，保持在牆內持續減速
      }
    }
  }
  iceWalls = iceWalls.filter(w => w.life > 0);
}

function drawIceWalls() {
  for (const wall of iceWalls) {
    const alpha = (wall.life / wall.maxLife) * 0.32;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = COLORS.crit; // 鬼火青
    ctx.beginPath(); ctx.arc(wall.x, wall.y, wall.radius, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = alpha * 1.6;
    ctx.strokeStyle = '#A8D8D0';
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(wall.x, wall.y, wall.radius, 0, Math.PI * 2); ctx.stroke();
    // 中心符文
    ctx.globalAlpha = alpha * 2;
    ctx.strokeStyle = COLORS.ink;
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(wall.x, wall.y, 10, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
  }
}

// Phase 6：匕首系統
// ─────────────────────────────────────────
function fireDagger() {
  const dualCount = 2 + (player.skillLevels['dual_throw'] || 0); // 基礎 2 把 + 雙投技能
  const baseAngle = player.bladeAngle;
  const spread = 0.35; // 扇形半角（≈20°）
  for (let i = 0; i < dualCount; i++) {
    // 2 把時：1 主刀正中 + 1 輔刀偏右 10°（玩家可瞄準）；3 把以上回扇形
    let offset;
    if (dualCount === 1) offset = 0;
    else if (dualCount === 2) offset = (i === 0) ? 0 : 0.18;
    else offset = (i / (dualCount - 1) - 0.5) * spread * 2;
    const angle = baseAngle + offset;
    daggers.push({
      x: player.x, y: player.y,
      vx: Math.cos(angle) * 8.5,
      vy: Math.sin(angle) * 8.5,
      angle,
      life: 90,
      maxLife: 90,
      hitSet: new Set(),  // 避免對同一敵人重複傷害
      splitLeft: 1,       // 命中可分裂一次
      scale: 1,
    });
  }
}

function updateDaggers() {
  const hasPlagueEvo   = player.evolutions && player.evolutions['plague_bringer'];
  const hasAssassinEvo = player.evolutions && player.evolutions['assassination_master'];
  const bleedLv    = player.skillLevels['bleed']       || 0;
  const poisonLv   = player.skillLevels['poison_blade'] || 0;
  const assassinLv = player.skillLevels['assassin']    || 0;

  const newDaggers = []; // 分裂出的子刀

  for (const d of daggers) {
    d.x += d.vx;
    d.y += d.vy;
    d.life--;

    for (const e of enemies) {
      if (e.dead || d.hitSet.has(e.id)) continue;
      if (!circleCollide(d.x, d.y, 5, e.x, e.y, e.radius)) continue;

      d.hitSet.add(e.id);

      // 爆擊判定：暗殺技能 + boss 非暗殺目標 + 進化全爆
      const isLowHp     = e.hp / e.maxHp < 0.3;
      const assassinAdd = assassinLv * 0.13;
      const critChance  = hasAssassinEvo ? 1 : (player.critChance + (isLowHp ? assassinAdd : 0));
      const isCrit      = Math.random() < critChance;

      if (isCrit) addFloatText(e.x, e.y - e.radius - 8, '⚡CRIT!', COLORS.crit, 'crit');
      const dmg = (hasAssassinEvo ? 2 : 1) * (isCrit ? 2 : 1);
      const killed = e.takeDamage(dmg);

      // DoT：放血
      if (bleedLv > 0 && !e.dead) {
        e.dotBleedTimer = 180 + bleedLv * 60; // 3-5 秒
        e.dotBleedDmg   = 1;
      }
      // DoT：毒刃（傳播給鄰近敵人）
      if (poisonLv > 0 && !e.dead) {
        e.dotPoisonTimer = 240 + poisonLv * 60;
        e.dotPoisonDmg   = 1;
        if (hasPlagueEvo) {
          // 瘟疫使者：傳播到全場
          for (const ne of enemies) {
            if (ne.dead || ne === e) continue;
            ne.dotPoisonTimer = 300;
            ne.dotPoisonDmg   = 1;
            ne.dotBleedTimer  = bleedLv > 0 ? 180 : (ne.dotBleedTimer || 0);
          }
        } else {
          // 一般：傳播給最近 2 隻
          let spread = 0;
          for (const ne of enemies) {
            if (spread >= 2 || ne.dead || ne === e) continue;
            const nx = ne.x - e.x, ny = ne.y - e.y;
            if (nx * nx + ny * ny < 120 * 120) {
              ne.dotPoisonTimer = 180;
              ne.dotPoisonDmg   = 1;
              spread++;
            }
          }
        }
      }

      if (killed) {
        killEnemy(e, true);
        addCombo(); // 連殺計數
      }

      // 分裂：命中時若還可分裂，往 ±45° 生兩把小飛刀
      if (d.splitLeft > 0) {
        const splitAngle = Math.PI / 3; // 60°
        for (let s = -1; s <= 1; s += 2) {
          const newAngle = d.angle + splitAngle * s;
          newDaggers.push({
            x: d.x, y: d.y,
            vx: Math.cos(newAngle) * 8.5,
            vy: Math.sin(newAngle) * 8.5,
            angle: newAngle,
            life: 45,
            maxLife: 45,
            hitSet: new Set(d.hitSet), // 繼承，避免回打原目標
            splitLeft: 0,
            scale: 0.75,
          });
        }
        addParticles(d.x, d.y, COLORS.crit, 4);
      }

      d.life = 0; // 匕首命中即消失
      break;
    }
  }
  if (newDaggers.length) daggers.push(...newDaggers);
  daggers = daggers.filter(d => d.life > 0);
}

function drawDaggers() {
  for (const d of daggers) {
    ctx.save();
    ctx.globalAlpha = d.life / d.maxLife;
    ctx.translate(d.x, d.y);
    ctx.rotate(d.angle);
    if (d.scale && d.scale !== 1) ctx.scale(d.scale, d.scale);
    // 木刻偏移陰影
    ctx.strokeStyle = 'rgba(26, 22, 18, 0.55)';
    ctx.lineWidth = 3.5;
    ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-10 + 1.5, 0 + 1.5); ctx.lineTo(12 + 1.5, 0 + 1.5); ctx.stroke();
    // 刀刃（ink 色）
    ctx.strokeStyle = COLORS.ink;
    ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(-10, 0); ctx.lineTo(12, 0); ctx.stroke();
    // 刀柄（muted）
    ctx.strokeStyle = COLORS.muted;
    ctx.lineWidth = 3.5;
    ctx.beginPath(); ctx.moveTo(-10, 0); ctx.lineTo(-4, 0); ctx.stroke();
    // 刀柄護格（垂直短線）
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(-4, -3.5); ctx.lineTo(-4, 3.5); ctx.stroke();
    // 爆擊光效：刀尖 crit 色高光
    if (d.hitSet.size === 0) { // 尚未命中
      ctx.strokeStyle = 'rgba(95, 168, 156, 0.4)';
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(8, 0); ctx.lineTo(14, 0); ctx.stroke();
    }
    ctx.lineCap = 'butt';
    ctx.restore();
  }
}

/** 取得敵人追蹤目標座標（幻影技能啟用時分散 AI） */
function getEnemyTarget(enemy) {
  if (currentCharacter !== 'rogue' || phantoms.length === 0 || enemy.type === 'boss') {
    return { tx: player.x, ty: player.y };
  }
  // 每 180 幀重新決定追誰
  if (!enemy.decoyTimer || enemy.decoyTimer <= 0) {
    enemy.decoyTimer = 180;
    const alive = phantoms.filter(p => p.life > 0);
    enemy.phantomRef = (Math.random() < 0.55 && alive.length > 0)
      ? alive[Math.floor(Math.random() * alive.length)]
      : null;
  }
  enemy.decoyTimer--;
  if (enemy.phantomRef && enemy.phantomRef.life > 0) {
    return { tx: enemy.phantomRef.x, ty: enemy.phantomRef.y };
  }
  return { tx: player.x, ty: player.y };
}

function addCombo() {
  if (currentCharacter !== 'rogue' && currentCharacter !== 'necromancer') return;
  comboCount++;
  comboTimer = 120; // 2 秒窗口
  if (comboCount > runStats.maxCombo) runStats.maxCombo = comboCount;
  if (comboCount >= 3) {
    addFloatText(player.x, player.y - 42, `☠ ${comboCount}x COMBO!`, COLORS.xp, 'crit');
  }
}

function updatePhantoms() {
  const phantomLv = player.skillLevels['phantom'] || 0;
  if (phantomLv > 0) {
    phantomSpawnTimer++;
    const spawnInterval = Math.max(120, 240 - phantomLv * 40);
    if (phantomSpawnTimer >= spawnInterval) {
      phantomSpawnTimer = 0;
      const angle = Math.random() * Math.PI * 2;
      const dist  = 50 + Math.random() * 60;
      phantoms.push({
        x: player.x + Math.cos(angle) * dist,
        y: player.y + Math.sin(angle) * dist,
        life: 300, maxLife: 300,
        driftAngle: Math.random() * Math.PI * 2
      });
    }
  }
  for (const p of phantoms) {
    p.life--;
    // 緩慢漂移
    p.x += Math.cos(p.driftAngle * 1.3) * 0.4;
    p.y += Math.sin(p.driftAngle * 1.7) * 0.4;
  }
  phantoms = phantoms.filter(p => p.life > 0);
}

function drawPhantoms() {
  for (const p of phantoms) {
    const alpha = (p.life / p.maxLife) * 0.38;
    ctx.save();
    ctx.globalAlpha = alpha;
    // 幻影：淡色人形輪廓（woodblock 無 shadowBlur）
    ctx.fillStyle = COLORS.muted;
    ctx.strokeStyle = COLORS.bg;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.ellipse(p.x, p.y, 11, 16, p.driftAngle, 0, Math.PI * 2);
    ctx.fill(); ctx.stroke();
    ctx.beginPath();
    ctx.arc(p.x + Math.cos(p.driftAngle) * 9, p.y + Math.sin(p.driftAngle) * 9, 7, 0, Math.PI * 2);
    ctx.fill(); ctx.stroke();
    // 血色腰帶（盜賊幻影特徵）
    ctx.strokeStyle = 'rgba(123, 26, 26, 0.7)';
    ctx.lineWidth = 2.5;
    const rx = -Math.sin(p.driftAngle), ry = Math.cos(p.driftAngle);
    ctx.beginPath();
    ctx.moveTo(p.x - rx * 10, p.y - ry * 10);
    ctx.lineTo(p.x + rx * 10, p.y + ry * 10);
    ctx.stroke();
    ctx.restore();
  }
}

function checkEvolutions() {
  const evoDefs = currentCharacter === 'mage'  ? MAGE_EVOLUTION_DEFS  :
                  currentCharacter === 'rogue' ? ROGUE_EVOLUTION_DEFS : EVOLUTION_DEFS;
  for (const evo of evoDefs) {
    if (player.evolutions[evo.id]) continue;
    const allMet = Object.entries(evo.requires).every(
      ([id, req]) => (player.skillLevels[id] || 0) >= req
    );
    if (allMet) triggerEvolution(evo);
  }
}

function triggerEvolution(evo) {
  player.evolutions[evo.id] = true;
  evo.apply(player);
  SFX.play('evolution');
  evolutionAnnouncements.push({
    line1: `⚡ 武器進化！${evo.name} ⚡`,
    line2: evo.desc,
    life: 180, maxLife: 180
  });
  for (let i = 0; i < 50; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 2 + Math.random() * 4;
    particles.push({
      x: player.x, y: player.y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 40 + Math.random() * 30,
      maxLife: 60,
      color: i % 2 === 0 ? '#C8941A' : '#C44B1A',  // xp-glow / warning

}

function drawEvolutionAnnouncements() {
  evolutionAnnouncements.forEach((ann, i) => {
    const alpha = Math.min(1, ann.life / 30);
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.textAlign = 'center';
    ctx.font = 'bold 26px "Pirata One", cursive';
    ctx.lineWidth = 4;
    ctx.strokeStyle = '#1A1612';   // ink 底描邊（woodcut 法）
    const y1 = canvas.height / 2 - 20 + i * 70;
    const y2 = canvas.height / 2 + 10 + i * 70;
    ctx.strokeText(ann.line1, canvas.width / 2, y1);
    ctx.fillStyle = '#C8941A';     // xp-glow 金
    ctx.fillText(ann.line1, canvas.width / 2, y1);
    ctx.font = '16px "IM Fell English", serif';
    ctx.lineWidth = 3;
    ctx.strokeText(ann.line2, canvas.width / 2, y2);
    ctx.fillStyle = '#E8DCC4';
    ctx.fillText(ann.line2, canvas.width / 2, y2);
    ctx.restore();
    ann.life--;
  });
  evolutionAnnouncements = evolutionAnnouncements.filter(a => a.life > 0);
}

// 鬼火彈丸系統
// ─────────────────────────────────────────
let ghostOrbs = [];

function fireGhostOrb() {
  // 找最近的存活敵人
  let target = null;
  let minDist = Infinity;
  for (const e of enemies) {
    if (e.dead) continue;
    const dx = e.x - player.x, dy = e.y - player.y;
    const d = dx * dx + dy * dy;
    if (d < minDist) { minDist = d; target = e; }
  }

  const angle = target
    ? Math.atan2(target.y - player.y, target.x - player.x)
    : Math.random() * Math.PI * 2;

  ghostOrbs.push({
    x: player.x, y: player.y,
    vx: Math.cos(angle) * 4.5,
    vy: Math.sin(angle) * 4.5,
    life: 120,
    maxLife: 120,
    targetId: target ? target.id : null
  });
}

function updateGhostOrbs() {
  for (const orb of ghostOrbs) {
    // 追蹤目標
    if (orb.targetId !== null) {
      const t = enemies.find(e => e.id === orb.targetId && !e.dead);
      if (t) {
        const dx = t.x - orb.x, dy = t.y - orb.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist > 1) {
          orb.vx += (dx / dist) * 0.6;
          orb.vy += (dy / dist) * 0.6;
          // 限速
          const spd = Math.sqrt(orb.vx * orb.vx + orb.vy * orb.vy);
          if (spd > 5.5) { orb.vx = (orb.vx / spd) * 5.5; orb.vy = (orb.vy / spd) * 5.5; }
        }
      }
    }
    orb.x += orb.vx;
    orb.y += orb.vy;
    orb.life--;

    // 命中敵人（V3：使用 takeDamage，支援多 HP 怪物）
    for (const e of enemies) {
      if (!e.dead && circleCollide(orb.x, orb.y, 6, e.x, e.y, e.radius)) {
        if (e.takeDamage()) killEnemy(e, false); // false = 連鎖殺，不觸發 bomb/chain
        orb.life = 0;
        break;
      }
    }
  }
  ghostOrbs = ghostOrbs.filter(o => o.life > 0);
}
