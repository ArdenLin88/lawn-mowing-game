// 遊戲結束畫面
// ─────────────────────────────────────────
function drawGameOverScreen() {
  const cw = canvas.width, ch = canvas.height;
  ctx.fillStyle = 'rgba(26, 22, 18, 0.92)';
  ctx.fillRect(0, 0, cw, ch);

  // ── 標題 ──
  ctx.font = `bold 52px ${FONTS.display}`;
  ctx.textAlign = 'center';
  ctx.lineWidth = 4; ctx.strokeStyle = COLORS.bg;
  ctx.strokeText('此英靈已入冊', cw / 2, 74);
  ctx.fillStyle = COLORS.warning;
  ctx.fillText('此英靈已入冊', cw / 2, 74);

  // ── 分隔線 ──
  ctx.strokeStyle = COLORS.muted; ctx.lineWidth = 1; ctx.globalAlpha = 0.4;
  ctx.beginPath(); ctx.moveTo(cw/2 - 220, 90); ctx.lineTo(cw/2 + 220, 90); ctx.stroke();
  ctx.globalAlpha = 1;

  // ── 本局統計面板 ──
  const cur = { kills: killCount, level, time: gameTime, maxCombo: runStats.maxCombo, dmg: runStats.damageTaken };
  const last = lastRunStats;
  const panelX = cw / 2 - 200, panelW = 400;

  function statRow(label, curVal, lastVal, y) {
    ctx.textAlign = 'left';
    ctx.font = `italic 16px ${FONTS.body}`;
    ctx.fillStyle = COLORS.muted;
    ctx.fillText(label, panelX + 8, y);

    ctx.textAlign = 'right';
    ctx.font = `bold 20px ${FONTS.display}`;
    ctx.fillStyle = COLORS.ink;
    ctx.fillText(String(curVal), panelX + panelW - 55, y);

    if (last !== null && lastVal !== undefined) {
      const diff = (typeof curVal === 'number' && typeof lastVal === 'number') ? curVal - lastVal : 0;
      if (diff !== 0) {
        ctx.font = `14px ${FONTS.body}`;
        ctx.fillStyle = diff > 0 ? COLORS.xp : COLORS.warning;
        ctx.fillText((diff > 0 ? '▲' : '▼') + Math.abs(diff), panelX + panelW - 8, y);
      }
    }
  }

  // 面板背景
  ctx.fillStyle = COLORS.surface;
  ctx.fillRect(panelX, 100, panelW, 170);
  ctx.fillStyle = COLORS.bg;
  ctx.fillRect(panelX - 2, 98, panelW + 4, 174);
  ctx.fillStyle = COLORS.surface;
  ctx.fillRect(panelX, 100, panelW, 170);
  ctx.strokeStyle = COLORS.muted; ctx.lineWidth = 1;
  ctx.strokeRect(panelX, 100, panelW, 170);

  const mins = Math.floor(cur.time / 60 / 60);
  const secs = Math.floor(cur.time / 60) % 60;
  const timeStr = `${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}`;
  const lastMins = last ? Math.floor(last.time / 60 / 60) : 0;
  const lastSecs = last ? Math.floor(last.time / 60) % 60 : 0;

  statRow('⚔  擊殺數', cur.kills,    last ? last.kills    : undefined, 128);
  statRow('★  到達等級', cur.level,  last ? last.level    : undefined, 158);
  statRow('⏱  生存時間', timeStr,    null, 188);
  statRow('⚡  最高連殺', cur.maxCombo, last ? last.maxCombo : undefined, 218);
  statRow('🩸  受傷次數', cur.dmg,   last ? last.damageTaken : undefined, 248);

  if (last === null) {
    ctx.textAlign = 'center';
    ctx.font = `italic 13px ${FONTS.body}`;
    ctx.fillStyle = COLORS.muted;
    ctx.fillText('（首局，下次顯示對比）', cw / 2, 282);
  }

  // ── 獲得墓誌銘金幣 ──
  const earned = Math.floor(cur.kills / 5) + (cur.level - 1) * 2 + 1;
  ctx.textAlign = 'center';
  ctx.font = `bold 20px ${FONTS.display}`;
  ctx.fillStyle = COLORS.xp;
  ctx.fillText(`獲得 ${earned} 枚墓誌銘金幣（累計：${tombCoins}）`, cw / 2, 298);

  // ── 稱號 ──
  const grade = cur.kills >= 80 ? '骨山戰神' : cur.kills >= 50 ? '骷髏剋星' :
                cur.kills >= 25 ? '割草英雄' : '初出茅廬的勇者';
  ctx.font = `22px ${FONTS.body}`;
  ctx.fillStyle = COLORS.ink;
  ctx.fillText(grade, cw / 2, 328);

  // ── 重玩提示 ──
  ctx.font = `bold 20px ${FONTS.display}`;
  ctx.fillStyle = COLORS.xp;
  ctx.fillText('點擊或按 R 重新開始', cw / 2, 366);
}

// ─────────────────────────────────────────
// 生怪
// ─────────────────────────────────────────
function spawnEnemy(forceType) {
  const type = forceType || getEnemyTypeByTime(); // V3：時間驅動類型
  enemies.push(new Enemy(type));
}

function getSpawnCount() {
  return Math.min(1 + Math.floor(killCount / 8), 4);
}

// ─────────────────────────────────────────
// 碰撞：圓 vs 圓
// ─────────────────────────────────────────
function circleCollide(ax, ay, ar, bx, by, br) {
  const dx = bx - ax, dy = by - ay;
  const r = ar + br;
  return dx * dx + dy * dy < r * r; // 平方距離，免 sqrt
}

// ─────────────────────────────────────────
// 殺怪邏輯（統一處理 EXP + area_bomb + chain_slash）
// isPrimary: true = 刀刃直接命中（觸發 bomb/chain），false = 連鎖殺（不再觸發）
// ─────────────────────────────────────────
function killEnemy(e, isPrimary = true) {
  e.dead = true;
  killCount++;
  runStats.kills++;
  // 圖鑑解鎖追蹤
  codexKillCounts[e.type] = (codexKillCounts[e.type] || 0) + 1;
  if (!codexUnlocked.has(e.type)) {
    codexUnlocked.add(e.type);
    codexNewUnlock = { type: e.type, timer: 180 };
    savePersistentData();
  }
  // 死靈師 soul_harvest：擊殺 15% 回血
  if (currentCharacter === 'necromancer' && (player.skillLevels['soul_harvest'] || 0) > 0) {
    if (Math.random() < 0.15 * (player.skillLevels['soul_harvest'])) {
      player.hp = Math.min(player.hp + 1, player.maxHp);
      addFloatText(player.x, player.y - 28, '+1 ☠', COLORS.xp);
    }
  }
  // V3：依怪物類型給分
  score += e.type === 'zombie' ? 2 : (e.type === 'elite_skeleton' ? 4 : (e.type === 'skeleton_archer' ? 3 : (e.type === 'boss' ? 100 : 1)));

  // 大魔王死亡處理
  if (e.type === 'boss') {
    if (!bossRevived) {
      // 第一次「死亡」→ 復活！恢復 50% 血量
      bossRevived = true;
      e.dead = false;       // 取消死亡標記
      e.hp = Math.ceil(e.maxHp * 0.5);
      e.hitCooldown = 60;   // 1 秒無敵幀，留給玩家反應
      e.flashTimer = 40;    // 白色閃爍表示復活
      killCount--;          // 撤銷計數
      score -= 100;         // 撤銷分數
      // 復活特效：中型粒子環 + 浮動文字
      for (let i = 0; i < 30; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 1.5 + Math.random() * 3;
        const life = 40 + Math.random() * 30;
        particles.push({
          x: e.x, y: e.y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          life, maxLife: life,  // C1：用 size 而非 radius，與繪製一致
          color: ['#7B1A1A','#C44B1A','#E8DCC4'][Math.floor(Math.random()*3)],
          size: 3 + Math.random() * 4
        });
      }
      addFloatText(e.x, e.y - e.radius - 20, '☠ 復活！', '#C44B1A');
      bossRevivesSeen++;
      lsSet('bossRevivesSeen', bossRevivesSeen);
      SFX.bossHurt && SFX.bossHurt();
      return;
    }
    // 第二次真正死亡 → 破關
    bossDefeated = true;
    BGM.stop();
    // 壯觀的粒子爆炸
    for (let i = 0; i < 80; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 2 + Math.random() * 6;
      const life = 60 + Math.random() * 60;
      particles.push({
        x: e.x, y: e.y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        life, maxLife: life,  // C1：用 size 而非 radius
        color: ['#C8941A','#C44B1A','#7B1A1A','#E8DCC4'][Math.floor(Math.random()*4)],
        size: 4 + Math.random() * 5
      });
    }
    state = 'victory';
    return;
  }

  addBloodDecal(e.x, e.y, e.type);
  // XP 浮動文字：依怪物類型顯示實際經驗值與顏色
  const xpColors = {
    skeleton:        '#D4C8A8',   // 骨粉（骨骼色）
    zombie:          '#7A6A52',   // 蝕紙黃（muted）
    skeleton_archer: '#C8941A',   // 聖物金（遠程更值錢）
    elite_skeleton:  '#C8941A',   // 聖物金（精英）
  };
  const xpColor = xpColors[e.type] || '#C8941A';
  const xpLabel = e.expValue >= 4 ? `+${e.expValue} XP` : `+${e.expValue}`;
  if (e.type === 'skeleton') {
    addBoneFragments(e.x, e.y);
    addFloatText(e.x, e.y - e.radius - 5, xpLabel, xpColor);
  } else {
    addBloodSplatter(e.x, e.y);
    addFloatText(e.x, e.y - e.radius - 5, xpLabel, xpColor);
  }

  // EXP 寶石
  dropExpGem(e.x, e.y, e.expValue);

  if (!isPrimary) return; // 連鎖殺不再觸發以下效果
  SFX.play('slash');

  // area_bomb：刀刃命中才觸發
  if (player.areaBombRadius > 0) {
    for (const other of enemies) {
      if (!other.dead && circleCollide(e.x, e.y, player.areaBombRadius, other.x, other.y, other.radius)) {
        killEnemy(other, false); // false = 連鎖殺
      }
    }
    // 爆炸視覺
    addParticles(e.x, e.y, '#C44B1A', 12);   // warning
    addFloatText(e.x, e.y - 20, '✦', '#C8941A');  // xp-glow，無 emoji
  }

  // chain_slash：刀刃命中才觸發（V3：stormChain 加倍半徑）
  if (player.chainSlashLevel > 0) {
    const baseRadius = CHAIN_RADII[Math.min(player.chainSlashLevel - 1, 2)];
    const chainRadius = player.stormChainActive ? baseRadius * 2 : baseRadius;
    for (const other of enemies) {
      if (!other.dead && circleCollide(e.x, e.y, chainRadius, other.x, other.y, other.radius)) {
        killEnemy(other, false); // false = 連鎖殺
      }
    }
  }
}

// ─────────────────────────────────────────
// 遊戲初始化 / 重置
// ─────────────────────────────────────────
// 觸控裝置：嘗試進入全螢幕並鎖定橫向（Android Chrome 有效；iOS 不支援會 silent fail）
async function tryLockLandscape() {
  if (!isTouchDevice) return;
  try {
    if (document.documentElement.requestFullscreen && !document.fullscreenElement) {
      await document.documentElement.requestFullscreen();
    }
    if (screen.orientation && screen.orientation.lock) {
      await screen.orientation.lock('landscape');
    }
  } catch (e) {
    // iOS / 不支援的瀏覽器會 reject，無妨 — CSS 旋轉提示遮罩會接手
  }
}

function startGame() {
  state = 'playing';
  resetGame();
  BGM.start();
  tryLockLandscape();
}

function resetGame() {
  // 法師系統重置
  magicBolts = []; beams = []; beamTimer = 0; mageFireTimer = 0;
  iceWalls = []; iceWallTimer = 0;
  // 盜賊系統重置
  daggers = []; rogueDaggerTimer = 0;
  phantoms = []; phantomSpawnTimer = 0;
  comboCount = 0; comboTimer = 0;
  player.dashActive = 0; player.dashCooldown = 0;

  player.x = canvas.width / 2;
  player.y = canvas.height / 2;
  player.invincible = 0;
  player.bladeSpinAngle = 0;

  // 技能效果屬性完整歸零（工程審查補充）
  // 角色分支：騎士 vs 法師
  if (currentCharacter === 'mage') {
    player.speed       = 2.8;
    player.bladeRadius = 0;
    player.bladeArc    = 0;
    player.maxHp       = 3;
    player.hp          = 3;
  } else if (currentCharacter === 'rogue') {
    player.speed       = 4.2;
    player.bladeRadius = 0;
    player.bladeArc    = 0;
    player.maxHp       = 4;
    player.hp          = 4;
  } else if (currentCharacter === 'necromancer') {
    player.speed       = 3.0;
    player.bladeRadius = 65;   // 稍大的鐮刀範圍
    player.bladeArc    = Math.PI * 0.70; // 寬弧鐮刀
    player.maxHp       = 4;
    player.hp          = 4;
  } else { // knight
    player.speed       = 3.2;
    player.bladeRadius = 55;
    player.bladeArc    = Math.PI * 0.55;
    player.maxHp       = 5;
    player.hp          = 5;
  }
  player.magnetRange  = 80;
  player.skillLevels  = {};
  player.ghostOrbLevel  = 0;
  player.ghostOrbTimer  = 0;
  player.areaBombRadius = 0;
  player.chainSlashLevel = 0;
  player.critChance     = 0.15;

  score = 0;
  killCount = 0;
  frameCount = 0;
  spawnTimer = 0;
  spawnInterval = 110;

  exp = 0;
  level = 1;

  enemies = [];
  particles = [];
  floatTexts = [];
  bloodDecals = [];
  expGems = [];
  ghostOrbs = [];

  // V3 重置
  gameTime = 0;
  arrows = [];
  evolutionAnnouncements = [];
  inkBloomTimer = 0;
  aliveEnemyCount = 0;
  player.evolutions = {};
  player.soulScytheActive = false;
  player.hellfireActive = false;
  player.stormChainActive = false;

  // 大魔王重置
  bossSpawned = false;
  bossDefeated = false;
  bossRevived = false;

  // ── 本局統計重置 ──
  runStats = { kills:0, level:1, time:0, maxCombo:0, damageTaken:0 };
  perfectClearFlag = true;
  actPhase = 0;
  actBannerTimer = 0;
  codexNewUnlock = null;

  // ── 套用石板升級 ──
  if (currentCharacter === 'knight' && stoneTabletUpgrades['knight_blade']) {
    const n = stoneTabletUpgrades['knight_blade'];
    for (let i = 0; i < n; i++) player.bladeArc = Math.min(player.bladeArc * 1.05, Math.PI * 0.95);
  }
  if (currentCharacter === 'necromancer' && stoneTabletUpgrades['necro_arc']) {
    const n = stoneTabletUpgrades['necro_arc'];
    for (let i = 0; i < n; i++) player.bladeArc = Math.min(player.bladeArc * 1.05, Math.PI * 0.95);
  }
  // bonus_level：自動升一級
  if (stoneTabletUpgrades['bonus_level']) {
    exp = expToNext(1);
  }

  hideUpgradeMenu();

  for (let i = 0; i < 6; i++) spawnEnemy();
  state = 'playing';
  if (!BGM.isRunning()) BGM.start();
}

// ─────────────────────────────────────────
// 繪製 EXP 寶石
// ─────────────────────────────────────────
function drawExpGems() {
  for (const gem of expGems) {
    ctx.save();
    ctx.globalAlpha = 0.92;
    // 偏移陰影（woodblock 法，無 shadowBlur）
    ctx.fillStyle = 'rgba(26, 22, 18, 0.5)';
    ctx.beginPath();
    ctx.arc(gem.x + 1.5, gem.y + 1.5, 5, 0, Math.PI * 2);
    ctx.fill();
    // xp-glow 系列：大寶石聖物金，小寶石蝕紙黃
    const gemR = gem.value >= 4 ? 7 : (gem.value >= 2 ? 6 : 5);
    ctx.fillStyle = gem.value >= 4 ? '#C8941A' : (gem.value >= 2 ? '#A07010' : '#7A6A52');
    ctx.strokeStyle = '#1A1612';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(gem.x, gem.y, gemR, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    // 高光點（左上角）
    ctx.fillStyle = gem.value >= 4 ? '#E8C44A' : '#B08828';
    ctx.beginPath();
    ctx.arc(gem.x - gemR * 0.3, gem.y - gemR * 0.35, gemR * 0.28, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

// ─────────────────────────────────────────
// 繪製鬼火彈丸
// ─────────────────────────────────────────
function drawGhostOrbs() {
  for (const orb of ghostOrbs) {
    const alpha = orb.life / orb.maxLife;
    // V3：業火進化 → 大火球 + 紅色
    const orbR     = player.hellfireActive ? 12 : 6;
    // 設計系統：業火 → warning(#C44B1A), 普通 → xp-glow(#C8941A)
    const orbColor = player.hellfireActive ? '#C44B1A' : '#C8941A';
    const orbDark  = player.hellfireActive ? '#7B1A1A' : '#A07010';
    ctx.save();
    ctx.globalAlpha = alpha;
    // 偏移陰影（woodblock，無 shadowBlur）
    ctx.fillStyle = 'rgba(26, 22, 18, 0.45)';
    ctx.beginPath();
    ctx.arc(orb.x + 1.5, orb.y + 1.5, orbR, 0, Math.PI * 2);
    ctx.fill();
    // 主體
    ctx.fillStyle = orbDark;
    ctx.beginPath();
    ctx.arc(orb.x, orb.y, orbR, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = orbColor;
    ctx.beginPath();
    ctx.arc(orb.x - orbR * 0.15, orb.y - orbR * 0.15, orbR * 0.7, 0, Math.PI * 2);
    ctx.fill();
    // 高光
    ctx.fillStyle = '#E8DCC4';
    ctx.globalAlpha = alpha * 0.6;
    ctx.beginPath();
    ctx.arc(orb.x - orbR * 0.3, orb.y - orbR * 0.3, orbR * 0.25, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

// ─────────────────────────────────────────
// 主遊戲迴圈
// ─────────────────────────────────────────
function gameLoop() {
  frameCount++;
  // 平滑 EXP 進度條（lerp 向真實比例靠近）
  const _expTarget = Math.min(exp / expToNext(level), 1);
  expDisplayRatio += (_expTarget - expDisplayRatio) * 0.08;

  // ── 更新 ──
  if (state === 'playing') {
    gameTime++; // V3：遊戲計時
    player.update();

    // ── 三幕制轉場 ──
    if (actBannerTimer > 0) actBannerTimer--;

    // 第一幕 → 第二幕：累積 40 擊殺
    if (actPhase === 0 && killCount >= 40) {
      actPhase = 1;
      actBannerTimer = 200;
      addFloatText(canvas.width/2, canvas.height/2 - 50, '第二幕：腐敗森林', COLORS.xp, 'crit');
    }
    // 第二幕 → 第三幕：3 分鐘後大魔王登場
    if (actPhase >= 1 && gameTime >= 10800 && !bossSpawned) {
      bossSpawned = true;
      actPhase = 2;
      actBannerTimer = 200;
      spawnEnemy('boss');
      addFloatText(canvas.width/2, canvas.height/2 - 60, '☠ 第三幕：骷髏王廷', COLORS.warning, 'crit');
    }

    // 生怪（第三幕持續生怪，密度降低）
    if (!bossSpawned || actPhase >= 2) {
      spawnTimer++;
      if (spawnTimer >= spawnInterval) {
        spawnTimer = 0;
        if (!bossSpawned) {
          const n = getSpawnCount();
          for (let i = 0; i < n; i++) spawnEnemy();
        } else {
          // 第三幕：每 2 次觸發才生一隻，維持戰場張力
          if (Math.random() < 0.45) spawnEnemy();
        }
        spawnInterval = Math.max(35, 110 - Math.floor(killCount / 5) * 4);
      }
    }

    // 圖鑑解鎖動畫計時
    if (codexNewUnlock) {
      codexNewUnlock.timer--;
      if (codexNewUnlock.timer <= 0) codexNewUnlock = null;
    }

    // 更新敵人 + 碰撞
    for (const e of enemies) {
      e.update();

      if (!e.dead) {
        // 刀刃命中（V3：使用 takeDamage，支援多 HP 怪物）
        if (player.isInBladeZone(e.x, e.y, e.radius)) {
          // P2：爆擊判定
          const isCrit = Math.random() < player.critChance;
          if (isCrit) {
            addFloatText(e.x, e.y - e.radius - 8, '⚡CRIT!', COLORS.crit, 'crit');
          }
          if (e.takeDamage(isCrit ? 2 : 1)) killEnemy(e, true); // 死亡才 killEnemy
        }
        // 被敵人撞到（非刀刃區）
        else if (circleCollide(player.x, player.y, player.radius, e.x, e.y, e.radius)) {
          if (player.takeDamage()) {
            addFloatText(player.x, player.y - 25, '-1', '#C44B1A');  // warning
            if (player.hp <= 0) { SFX.play('gameover'); state = 'gameover'; BGM.stop(); }
          }
        }
      }
    }

    // 清除已完成死亡動畫的敵人
    enemies = enemies.filter(e => !e.dead || e.deathTimer < 26);

    // 快取存活敵人數（供 HUD 使用，避免重複 filter）
    aliveEnemyCount = enemies.reduce((n, e) => n + (e.dead ? 0 : 1), 0);

    // 血跡淡出（5 秒 = 300 frames）
    for (const d of bloodDecals) d.life--;
    bloodDecals = bloodDecals.filter(d => d.life > 0);

    // 更新 EXP 寶石（lerp 吸取）
    for (const gem of expGems) {
      // 初速度衰減
      gem.vx *= 0.88;
      gem.vy *= 0.88;
      gem.x += gem.vx;
      gem.y += gem.vy;

      const dx = player.x - gem.x;
      const dy = player.y - gem.y;
      const dist = Math.sqrt(dx * dx + dy * dy);

      if (dist < player.magnetRange && dist > 0.1) {
        gem.x += (dx / dist) * dist * 0.15;
        gem.y += (dy / dist) * dist * 0.15;
      }

      if (dist < 15) {
        exp += gem.value;
        gem.collected = true;
        SFX.play('gem');
        addFloatText(gem.x, gem.y - 10, `+${gem.value}`, '#C8941A');  // xp-glow
        checkLevelUp();
      }
    }
    expGems = expGems.filter(g => !g.collected);

    // 更新鬼火彈丸
    updateGhostOrbs();

    // V3：更新箭矢
    updateArrows();

    // Phase 5：法師 — 更新魔法彈 + 冰牆 + 光束
    if (currentCharacter === 'mage') {
      updateMagicBolts();
      updateIceWalls();
      // 以太光束進化：每 90 幀發射一道
      if (player.evolutions && player.evolutions['aether_beam']) {
        beamTimer++;
        if (beamTimer >= 90) {
          beamTimer = 0;
          spawnBeam(player.x, player.y, player.bladeAngle);
        }
      }
      updateBeams();
    }

    // Phase 6：盜賊 — 更新匕首 + 幻影 + combo 倒計時
    if (currentCharacter === 'rogue') {
      updateDaggers();
      updatePhantoms();
      if (comboTimer > 0) {
        comboTimer--;
        if (comboTimer <= 0) comboCount = 0;
      }
    }

    // 更新粒子
    for (const p of particles) {
      p.x += p.vx;
      p.y += p.vy;
      p.vx *= 0.92;
      p.vy *= 0.92;
      p.life--;
    }
    particles = particles.filter(p => p.life > 0);

    // 更新浮動文字
    for (const t of floatTexts) {
      t.y += t.vy;
      t.life--;
    }
    floatTexts = floatTexts.filter(t => t.life > 0);
  }

  // upgrade 狀態：一切凍結（敵人、寶石、鬼火），只重繪畫面
  // （canvas 繼續渲染，但不更新任何遊戲邏輯）

  // ── 繪製 ──
  drawBackground();

  for (const d of bloodDecals) {
    const fadeAlpha = d.alpha * 0.5 * (d.life / d.maxLife);
    if (fadeAlpha < 0.01) continue;
    ctx.save();
    ctx.globalAlpha = fadeAlpha;
    ctx.fillStyle = d.type === 'skeleton' ? '#9E9E8E' : '#4A2A2A';
    ctx.beginPath();
    ctx.arc(d.x, d.y, d.radius, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  // EXP 寶石（在粒子下層）
  drawExpGems();

  // 粒子
  for (const p of particles) {
    ctx.save();
    ctx.globalAlpha = p.life / p.maxLife;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  // 敵人
  for (const e of enemies) e.draw();

  if (state === 'playing' || state === 'upgrade' || state === 'gameover') {
    player.draw();
  }

  // 鬼火彈丸
  drawGhostOrbs();

  // V3：箭矢
  drawArrows();

  // Phase 5：法師 — 冰牆（地面）+ 魔法彈 + 光束（空中）
  if (currentCharacter === 'mage') {
    drawIceWalls();
    drawMagicBolts();
    drawBeams();
  }

  // Phase 6：盜賊 — 幻影（地面）+ 匕首（空中）
  if (currentCharacter === 'rogue') {
    drawPhantoms();
    drawDaggers();
  }

  // 浮動文字（設計系統：IM Fell English / Pirata One，無 Arial）
  for (const t of floatTexts) {
    ctx.save();
    ctx.globalAlpha = t.life / (t.maxLife || 50);
    ctx.fillStyle = t.color;
    ctx.strokeStyle = '#1A1612';
    ctx.textAlign = 'center';
    if (t.style === 'crit') {
      ctx.font = '26px "Pirata One", cursive';
      ctx.lineWidth = 4;
    } else {
      ctx.font = 'italic 18px "IM Fell English", serif';
      ctx.lineWidth = 3;
    }
    ctx.strokeText(t.text, t.x, t.y);
    ctx.fillText(t.text, t.x, t.y);
    ctx.restore();
  }

  // P3：低血 vignette（在 HUD 下層，playing 中才顯示）
  if (state === 'playing') drawLowBloodVignette();

  if (state === 'playing' || state === 'upgrade') drawHUD();
  if (state === 'start')      drawStartScreen();
  if (state === 'charselect') drawCharSelectScreen();
  if (state === 'gameover')   { drawHUD(); drawGameOverScreen(); }
  if (state === 'victory')    { drawHUD(); drawVictoryScreen(); }
  if (state === 'tablet')     drawTabletScreen();
  if (state === 'codex')      drawCodexScreen();

  // ── 幕次轉場 Banner（在最上層）──
  if (state === 'playing' && actBannerTimer > 0) {
    const alpha = Math.min(1, actBannerTimer / 30) * Math.min(1, (actBannerTimer) / 30);
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.font = `bold 36px ${FONTS.display}`;
    ctx.textAlign = 'center';
    const bannerText = actPhase === 1 ? '第二幕：腐敗森林' : '第三幕：骷髏王廷';
    const bannerColor = actPhase === 1 ? COLORS.xp : COLORS.warning;
    ctx.lineWidth = 4; ctx.strokeStyle = COLORS.bg;
    ctx.strokeText(bannerText, canvas.width/2, canvas.height/2 - 20);
    ctx.fillStyle = bannerColor;
    ctx.fillText(bannerText, canvas.width/2, canvas.height/2 - 20);
    ctx.restore();
  }

  // ── 圖鑑解鎖動畫（右下角飛入小卡）──
  if (codexNewUnlock && codexNewUnlock.timer > 0) {
    const entry = CODEX_ENTRIES[codexNewUnlock.type];
    if (entry) {
      const t = codexNewUnlock.timer;
      const alpha = Math.min(1, t / 20) * Math.min(1, (t - 0) / 20);
      const slideX = canvas.width - 220 + Math.max(0, (40 - t) * 4);
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.fillStyle = COLORS.surface;
      ctx.fillRect(slideX + 2, canvas.height - 78, 190, 60);
      ctx.fillStyle = COLORS.bg;
      ctx.fillRect(slideX, canvas.height - 80, 190, 60);
      ctx.fillStyle = COLORS.surface;
      ctx.fillRect(slideX, canvas.height - 80, 190, 60);
      ctx.strokeStyle = COLORS.xp; ctx.lineWidth = 1;
      ctx.strokeRect(slideX, canvas.height - 80, 190, 60);
      ctx.font = `bold 13px ${FONTS.display}`;
      ctx.fillStyle = COLORS.xp; ctx.textAlign = 'left';
      ctx.fillText('📜 圖鑑解鎖！', slideX + 10, canvas.height - 58);
      ctx.font = `italic 14px ${FONTS.body}`;
      ctx.fillStyle = COLORS.ink;
      ctx.fillText(entry.name, slideX + 10, canvas.height - 38);
      ctx.font = `italic 12px ${FONTS.body}`;
      ctx.fillStyle = COLORS.muted;
      ctx.fillText(entry.title, slideX + 10, canvas.height - 22);
      ctx.restore();
    }
  }

  // P4：ink-bloom 升級特效（最上層，HUD 之上）
  if (state === 'upgrade' || state === 'playing') drawInkBloom();

  updateJoystickVisibility();

  // 大魔王血量條（playing 狀態且大魔王出現時）
  if (state === 'playing' && bossSpawned && !bossDefeated) drawBossHpBar();

  // V3：武器進化公告（最上層）
  if (state === 'playing') drawEvolutionAnnouncements();

  requestAnimationFrame(gameLoop);
}

// ─────────────────────────────────────────
// 啟動
// ─────────────────────────────────────────
gameLoop();

// ═════════════════════════════════════════════════════════════
// AUTOPILOT bot（內嵌版）— LV1 無躲箭 / LV2 加飛箭閃避
//   右上 AUTO 面板控制。騎士專用：kiting 走位 + 自動選技能 + Boss 繞圈輸出。
// ═════════════════════════════════════════════════════════════
(function initAutopilot() {
  let botRunning = false, botVersion = 0, restarting = false, autoSkill = true;

  const panel  = document.getElementById('autopilot-panel');
  const toggle = document.getElementById('ap-toggle');
  const menu   = document.getElementById('ap-menu');
  const hudEl  = document.getElementById('ap-hud');

  toggle.addEventListener('click', () => menu.classList.toggle('open'));
  panel.querySelectorAll('.ap-lv').forEach(b =>
    b.addEventListener('click', () => startBot(parseInt(b.dataset.lv, 10))));
  panel.querySelector('.ap-stop').addEventListener('click', stopBot);
  const skillBtn = document.getElementById('ap-skill');
  skillBtn.addEventListener('click', () => {
    autoSkill = !autoSkill;
    skillBtn.textContent = '技能：' + (autoSkill ? '自動' : '手動');
    skillBtn.classList.toggle('active', autoSkill);
  });

  function startBot(v) {
    botVersion = v;
    panel.querySelectorAll('.ap-lv').forEach(b =>
      b.classList.toggle('active', parseInt(b.dataset.lv, 10) === v));
    hudEl.classList.add('show');
    if (!botRunning) { botRunning = true; requestAnimationFrame(botTick); }
  }
  function stopBot() {
    botRunning = false; botVersion = 0; joyMove.active = false;
    panel.querySelectorAll('.ap-lv').forEach(b => b.classList.remove('active'));
    hudEl.classList.remove('show');
  }

  const apDist = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);
  const apAlive = () => enemies.filter(e => !e.dead);
  const apBoss  = () => enemies.find(e => e.type === 'boss' && !e.dead);
  function apNorm(x, y) { const m = Math.hypot(x, y); return m < 0.0001 ? { x: 0, y: 0 } : { x: x / m, y: y / m }; }
  function apNearest(es) {
    let best = null, bd = Infinity;
    for (const e of es) { const d = apDist(player.x, player.y, e.x, e.y); if (d < bd) { bd = d; best = e; } }
    return best ? { e: best, d: bd } : null;
  }
  function apRepulsion(es, skip) {
    let x = 0, y = 0;
    for (const e of es) {
      if (e === skip) continue;
      const d = apDist(player.x, player.y, e.x, e.y);
      if (d > 170 || d < 1) continue;
      let w = 1 / (d * d) * 2600;
      if (e.type === 'elite_skeleton') w *= 2.4;   // 厚血精英殺不死，繞更開避免損血
      x += (player.x - e.x) / d * w; y += (player.y - e.y) / d * w;
    }
    return { x, y };
  }
  function apArrowDodge() {
    let x = 0, y = 0;
    if (typeof arrows === 'undefined') return { x, y };
    for (const a of arrows) {
      if (a.life <= 0) continue;
      const toPx = player.x - a.x, toPy = player.y - a.y;
      const d = Math.hypot(toPx, toPy);
      if (d > 320 || d < 1) continue;          // 更早偵測，爭取橫移時間
      const av = apNorm(a.vx, a.vy);
      const proj = toPx * av.x + toPy * av.y;
      if (proj <= 0) continue;
      let pX = toPx - proj * av.x, pY = toPy - proj * av.y;
      let pD = Math.hypot(pX, pY);
      if (pD > 44) continue;
      if (pD < 3) { pX = -av.y; pY = av.x; pD = 1; }
      const urg = 1 + (320 - proj) / 45;       // 越近閃越急（分母小→更陡）
      x += (pX / pD) * urg; y += (pY / pD) * urg;
    }
    return { x, y };
  }
  // 順路撿最近的經驗寶石（加速升級，低權重不蓋過保命）
  function apXpPull() {
    if (typeof expGems === 'undefined') return { x: 0, y: 0 };
    let best = null, bd = Infinity;
    for (const g of expGems) {
      if (g.collected) continue;
      const d = apDist(player.x, player.y, g.x, g.y);
      if (d < bd) { bd = d; best = g; }
    }
    if (!best || bd > 220) return { x: 0, y: 0 };   // 太遠不特地繞去撿
    return apNorm(best.x - player.x, best.y - player.y);
  }
  // 邊界排斥：離牆越近往場內推越用力，避免被擠進死角卡住
  function apBoundaryPush() {
    const margin = 130, k = 2.0;
    let x = 0, y = 0;
    const lx = player.x, rx = canvas.width - player.x;
    const ty = player.y, by = canvas.height - player.y;
    if (lx < margin) x += (margin - lx) / margin * k;   // 近左牆 → 往右
    if (rx < margin) x -= (margin - rx) / margin * k;   // 近右牆 → 往左
    if (ty < margin) y += (margin - ty) / margin * k;   // 近上牆 → 往下
    if (by < margin) y -= (margin - by) / margin * k;   // 近下牆 → 往上
    return { x, y };
  }
  // 敵人是否在畫面內（LV4 用：不追畫面外尚未入場的怪）
  function apOnScreen(e) {
    return e.x >= 0 && e.x <= canvas.width && e.y >= 0 && e.y <= canvas.height;
  }
  // LV3+ 攻擊模式：優先獵殺弓箭手，否則朝敵群質心推進 + 繞圈掃
  function apAttackMove(es) {
    const pool = (botVersion >= 4) ? es.filter(apOnScreen) : es;   // LV4：只鎖畫面內
    // 優先獵殺弓箭手（遠程威脅源）；但逃到貼邊的射手放棄，改往人多處衝
    const archers = pool.filter(e => e.type === 'skeleton_archer');
    const tgt = archers.length ? apNearest(archers).e : null;
    const wall = 70;
    const tgtNearWall = tgt && (tgt.x < wall || tgt.x > canvas.width - wall || tgt.y < wall || tgt.y > canvas.height - wall);
    if (tgt && !tgtNearWall && apDist(player.x, player.y, tgt.x, tgt.y) < 460) {
      const d = apDist(player.x, player.y, tgt.x, tgt.y) || 1;
      const toX = (tgt.x - player.x) / d, toY = (tgt.y - player.y) / d;
      const engage = player.bladeRadius * 0.5;
      const radial = (d - engage) * 0.08;                 // 更積極直撲射手
      return { x: toX * radial - toY * 0.4, y: toY * radial + toX * 0.4 };
    }
    // 無（近距）弓箭手 → 朝敵群質心推進
    let sx = 0, sy = 0, n = 0;
    for (const e of pool) {
      if (e.type === 'elite_skeleton') continue;   // 不主動往厚血精英衝
      if (apDist(player.x, player.y, e.x, e.y) < 260) { sx += e.x; sy += e.y; n++; }
    }
    if (n === 0) {
      const nr = pool.length ? apNearest(pool) : null;
      if (nr) return apNorm(nr.e.x - player.x, nr.e.y - player.y);
      return apNorm(canvas.width / 2 - player.x, canvas.height / 2 - player.y); // 畫面內無怪 → 回中心待命
    }
    const ccx = sx / n, ccy = sy / n;
    const d = apDist(player.x, player.y, ccx, ccy) || 1;
    const toX = (ccx - player.x) / d, toY = (ccy - player.y) / d;
    const engage = player.bladeRadius * 0.6;            // 理想交戰距離（敵人在刀刃內）
    const radial = (d - engage) * 0.06;                  // >engage 靠近 / <engage 微退
    return { x: toX * radial - toY * 0.6, y: toY * radial + toX * 0.6 }; // 推進 + 繞圈
  }
  function apComputeMove() {
    const es = apAlive(), cx = canvas.width / 2, cy = canvas.height / 2, boss = apBoss();
    let mx, my;
    if (boss) {
      const desired = player.bladeRadius - 12;
      const d = apDist(player.x, player.y, boss.x, boss.y) || 1;
      const toX = (boss.x - player.x) / d, toY = (boss.y - player.y) / d;
      const radial = (d - desired) * 0.05;
      mx = toX * radial - toY; my = toY * radial + toX;
      const rep = apRepulsion(es, boss); mx += rep.x; my += rep.y;
    } else if (botVersion >= 3 && player.hp > 2) {
      // LV3：血量健康時主動進攻清場
      const atk = apAttackMove(es); mx = atk.x; my = atk.y;
      const rep = apRepulsion(es, null); mx += rep.x * 0.4; my += rep.y * 0.4; // 輕度避免貼臉連撞
    } else {
      // LV1/LV2 kiting，或 LV3 低血退避保命
      const rep = apRepulsion(es, null);
      if (rep.x === 0 && rep.y === 0) {
        const n = apNearest(es);
        const m = n ? apNorm(n.e.x - player.x, n.e.y - player.y) : apNorm(cx - player.x, cy - player.y);
        mx = m.x; my = m.y;
      } else { mx = rep.x; my = rep.y; }
    }
    // 順路撿經驗（加速升級，間隙時往最近 XP 飄）
    const xp = apXpPull(); mx += xp.x * 1.2; my += xp.y * 1.2;
    // 邊界排斥（避免後期被逼到角落卡死）
    const bp = apBoundaryPush(); mx += bp.x; my += bp.y;
    if (botVersion >= 2) { const dg = apArrowDodge(); mx += dg.x * 2.0; my += dg.y * 2.0; }
    return apNorm(mx, my);
  }
  function apAutoPick() {
    const cards = document.querySelectorAll('#skill-cards-container .skill-card');
    if (!cards.length) return;
    // 先衝「割魂大鐮」（刀刃伸長+加寬）；沒材料可選才拿連鎖割。湊齊後主攻連鎖割清群
    const sl = player.skillLevels || {};
    const scytheReady = (sl['blade_radius'] || 0) >= 3 && (sl['blade_arc'] || 0) >= 3;
    const base = scytheReady
      ? ['chain_slash', 'player_speed', 'magnet', 'area_bomb', 'ghost_orb', 'blade_radius', 'blade_arc']
      : ['blade_radius', 'chain_slash', 'blade_arc', 'player_speed', 'magnet', 'area_bomb', 'ghost_orb'];
    // 護盾只在血量不夠（HP≤3）時才搶
    const PRIORITY = (player.hp <= 3) ? ['armor', ...base] : [...base, 'armor'];
    const pool = (typeof SKILL_POOL !== 'undefined') ? SKILL_POOL : [];
    const n2id = {}; pool.forEach(s => { n2id[s.name] = s.id; });
    // ×2 雙倍卡適度優先：保命(armor) > 進化核心材料 > 其他（其中 ×2 前移 2 位）
    const coreIds = scytheReady ? ['chain_slash'] : ['blade_radius', 'chain_slash', 'blade_arc'];
    const tierOf = (id) => (id === 'armor' && player.hp <= 3) ? 0 : (coreIds.includes(id) ? 1 : 2);
    let best = cards[0], br = Infinity;
    cards.forEach(c => {
      const id = n2id[c.querySelector('.card-name')?.textContent?.trim()];
      const rk = PRIORITY.indexOf(id); const rank = rk === -1 ? 50 : rk;
      let eff = tierOf(id) * 1000 + rank;
      if (tierOf(id) === 2 && c.classList.contains('double')) eff -= 2;   // 非核心 ×2 適度前移
      if (eff < br) { br = eff; best = c; }
    });
    best.click();
  }
  function apFmt(f) { const s = Math.floor(f / 60); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); }
  function apUpdateHud() {
    const boss = apBoss();
    const phase = boss ? 'BOSS ' + Math.ceil(boss.hp) + '/' + boss.maxHp : (actPhase >= 1 ? '第二幕' : '第一幕');
    const cn = { knight: '騎士', mage: '法師', rogue: '盜賊', necromancer: '死靈師' }[currentCharacter] || currentCharacter;
    hudEl.textContent = 'AUTOPILOT LV' + botVersion + '\n' + cn + '  HP ' + (player ? player.hp : '-') + '/' + (player ? player.maxHp : '-') +
      '\n擊殺 ' + killCount + '  ' + apFmt(gameTime) + '\n' + phase;
  }
  function botTick() {
    if (!botRunning) return;
    try {
      if (state === 'charselect') { currentCharacter = 'knight'; resetGame(); }
      else if (state === 'playing') {
        const mv = apComputeMove();
        joyMove.active = true; joyMove.x = mv.x; joyMove.y = mv.y;
        const boss = apBoss();
        const aimPool = (botVersion >= 4) ? apAlive().filter(apOnScreen) : apAlive();
        const aim = boss || (apNearest(aimPool) || {}).e;
        if (aim) { mouseX = aim.x; mouseY = aim.y; }
      } else if (state === 'upgrade') { joyMove.active = false; if (autoSkill) apAutoPick(); }
      else if (state === 'victory') { joyMove.active = false; }
      else if (state === 'gameover') {
        joyMove.active = false;
        if (!restarting) { restarting = true; setTimeout(() => { if (botRunning) goToCharSelect(); restarting = false; }, 3000); }
      }
      apUpdateHud();
    } catch (err) { console.warn('autopilot error:', err); }
    requestAnimationFrame(botTick);
  }
})();

// 靜音開關綁定
(function initSoundToggle() {
  const btn = document.getElementById('sound-toggle');
  if (!btn) return;
  btn.addEventListener('click', () => {
    audioMuted = !audioMuted;
    btn.classList.toggle('muted', audioMuted);
    BGM.setVolume(audioMuted ? 0 : 0.7);
  });
})();
</script>
